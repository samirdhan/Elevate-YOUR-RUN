<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Elevate your RUN — a self-contained coach training log: multi-athlete tracking, structured workouts, a training-block builder, calendar, progression charts, and read-only shareable athlete links. All data stays in your browser.">
<meta name="theme-color" content="#0f1115">
<meta property="og:title" content="Elevate your RUN — Coach Training Log">
<meta property="og:description" content="Plan, log and share running training — multi-athlete, structured workouts, calendar, progression charts.">
<meta property="og:type" content="website">
<title>Elevate your RUN — Coach Training Log</title>
<style>
/* ===================== THEME TOKENS ===================== */
:root{
  --bg:#0f1115;
  --panel:#171a21;
  --panel-2:#1e222b;
  --line:#2a2f3a;
  --text:#e7ebf3;
  --muted:#9aa4b5;
  --accent:#ff6b35;
  --accent-2:#ffb703;
  --easy:#34d399;
  --tempo:#fb923c;
  --interval:#f43f5e;
  --fartlek:#a78bfa;
  --long:#38bdf8;
  --race:#fbbf24;
  --recovery:#94a3b8;
  --sidebar-grad:linear-gradient(180deg,#12151c,#0d0f14);
  --topbar-bg:rgba(15,17,21,.7);
  --radius:16px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
body.light{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --panel-2:#eef1f7;
  --line:#e0e5ee;
  --text:#1a2233;
  --muted:#64707f;
  --accent:#ff6b35;
  --accent-2:#f59e0b;
  --easy:#10b981;
  --tempo:#f97316;
  --interval:#e11d48;
  --fartlek:#8b5cf6;
  --long:#0ea5e9;
  --race:#f59e0b;
  --recovery:#64748b;
  --sidebar-grad:linear-gradient(180deg,#ffffff,#f4f6fb);
  --topbar-bg:rgba(244,246,251,.8);
  --shadow:0 10px 30px rgba(20,30,50,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}
.app{display:flex;min-height:100vh}

/* ===================== SIDEBAR ===================== */
.sidebar{width:248px;background:var(--sidebar-grad);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px 20px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;box-shadow:0 6px 16px rgba(255,107,53,.4)}
.brand h1{font-size:18px;font-weight:800;letter-spacing:-.4px}
.brand span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:var(--muted);font-weight:600;font-size:14px;transition:.15s;text-align:left;width:100%}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button.active{background:linear-gradient(135deg,rgba(255,107,53,.18),rgba(255,183,3,.08));color:var(--text)}
.nav .ic{width:20px;text-align:center;font-size:16px}
.sidebar .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line)}
.toggle-row{display:flex;gap:6px;margin:14px 4px 4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.toggle-row button{flex:1;padding:7px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);transition:.15s}
.toggle-row button.active{background:var(--accent);color:#fff}
.theme-btn{margin:10px 4px 0;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:12.5px;width:calc(100% - 8px)}
.theme-btn:hover{background:var(--panel-2)}

/* ===================== MAIN ===================== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:18px 30px;border-bottom:1px solid var(--line);background:var(--topbar-bg);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .title{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-right:auto}
.topbar .title small{display:block;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0}
.athlete-select{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px}
.athlete-select .av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.athlete-select select{background:transparent;border:none;color:var(--text);font-weight:700;font-size:14px;outline:none;padding-right:4px;cursor:pointer}
.athlete-select select option{background:var(--panel);color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:11px;font-weight:700;font-size:13.5px;transition:.15s}
.btn-primary{background:linear-gradient(135deg,var(--accent),#ff8a5c);color:#fff;box-shadow:0 6px 16px rgba(255,107,53,.3)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{background:var(--panel-2)}
.content{padding:26px 30px 60px;max-width:1240px;width:100%;margin:0 auto}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===================== CARDS / GRID ===================== */
.grid{display:grid;gap:18px}
.stat-grid{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card h3{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.stat .num{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.stat .num small{font-size:15px;color:var(--muted);font-weight:600}
.stat .sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.stat .sub.up{color:var(--easy)}
.stat .sub.down{color:var(--interval)}
.section-title{font-size:16px;font-weight:800;margin:26px 0 14px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-title .pill{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel-2);padding:3px 9px;border-radius:20px}
.section-title .spacer{margin-left:auto}

/* streak ring */
.streak-wrap{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:96px;height:96px;flex-shrink:0}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800}
.streak-info .big{font-size:15px;font-weight:700}
.streak-info .small{font-size:12.5px;color:var(--muted);margin-top:3px}
.week-dots{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.week-dots .d{width:22px;height:22px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:10px;color:var(--muted);font-weight:700}
.week-dots .d.hit{background:var(--easy);color:#fff;border-color:transparent}

/* chart */
.chart-box{position:relative}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* run list */
.run-item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:10px;transition:.15s}
.run-item:hover{border-color:var(--accent)}
.run-item.planned{border-style:dashed;opacity:.9}
.run-type-tag{width:6px;align-self:stretch;border-radius:6px;flex-shrink:0}
.run-icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.run-main{flex:1;min-width:0}
.run-main .rt{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.run-main .rd{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-metrics{display:flex;gap:22px;text-align:right;flex-shrink:0}
.run-metrics div .m{font-weight:800;font-size:15px}
.run-metrics div .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.run-del{color:var(--muted);font-size:16px;padding:6px;border-radius:8px}
.run-del:hover{color:var(--interval);background:var(--panel)}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.tag-planned{background:rgba(255,183,3,.18);color:var(--accent-2)}
.tag-done{background:rgba(52,211,153,.18);color:var(--easy)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e-ic{font-size:40px;margin-bottom:12px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.cal-head h2{font-size:20px;font-weight:800;letter-spacing:-.4px}
.cal-nav{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:16px}
.cal-nav:hover{background:var(--panel-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding-bottom:4px}
.cal-cell{min-height:96px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;transition:.12s;position:relative;overflow:hidden}
.cal-cell:hover{border-color:var(--accent);background:var(--panel-2)}
.cal-cell.empty-cell{background:transparent;border-color:transparent;cursor:default}
.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-cell .dn{font-size:12.5px;font-weight:700;color:var(--muted)}
.cal-cell.today .dn{color:var(--accent)}
.cal-chip{font-size:10.5px;font-weight:700;padding:3px 6px;border-radius:6px;color:#fff;margin-top:5px;display:flex;justify-content:space-between;gap:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-chip.plan{background:transparent!important;border:1.5px dashed currentColor;padding:2px 5px}
.cal-chip.race{background:transparent!important;border:1.5px solid var(--race);color:var(--race);font-weight:800}
.pace-toggle{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pace-toggle:hover{background:var(--panel)}
/* ===================== PACE CALCULATOR ===================== */
.pc-input{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px;align-items:end}
.pc-time{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pc-vdot{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,rgba(255,107,53,.14),rgba(255,183,3,.06));border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:18px 0}
.pc-vdot .vnum{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--accent)}
.pc-vdot .vlab{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.pc-vdot .vdesc{font-size:12.5px;color:var(--muted);line-height:1.5}
.pace-table{width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;border-collapse:separate;border-spacing:0}
.pace-table th{background:var(--panel-2);font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
.pace-table td{padding:12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.pace-table tr:last-child td{border-bottom:none}
.pace-table .zone{font-weight:800;display:flex;align-items:center;gap:9px}
.pace-table .zdot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.pace-table .zp{font-size:11.5px;color:var(--muted);font-weight:600}
.pace-table .pace-val{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pace-table .split{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.pace-use{padding:6px 12px;border-radius:8px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;border:none;cursor:pointer}
.pace-use:hover{filter:brightness(1.08)}
.pace-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.pace-legend .pl{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:12px;color:var(--muted);line-height:1.5}
.pace-legend .pl b{color:var(--text)}
.pred-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:6px}
.pred-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 10px;text-align:center}
.pred-card .pd{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.pred-card .pt{font-size:17px;font-weight:800;margin-top:5px;font-variant-numeric:tabular-nums}
.pc-open-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);font-weight:700;font-size:12.5px;cursor:pointer}
.pc-open-btn:hover{border-color:var(--accent)}
.pace-helper{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-top:14px}
.pace-helper .ph-h{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pace-chips{display:flex;gap:8px;flex-wrap:wrap}
.pace-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:700;transition:.12s;cursor:pointer}
.pace-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.pace-chip .cdot{width:9px;height:9px;border-radius:3px}
.pace-chip .cv{font-variant-numeric:tabular-nums;color:var(--muted)}
.pace-chip small{color:var(--muted);font-weight:600}
@media(max-width:1000px){.pc-input{grid-template-columns:1fr 1fr}.pred-grid{grid-template-columns:repeat(3,1fr)}.pace-legend{grid-template-columns:1fr}}
.pc-hist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pc-hist-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px}
.pc-hist-row .phd{color:var(--muted)}
.pc-hist-row .phv{font-weight:800;font-variant-numeric:tabular-nums}
.tmpl-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tmpl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.tmpl-name{font-weight:700;font-size:13px}
.tmpl-meta{color:var(--muted);font-size:11.5px;margin-top:2px}
.tmpl-actions{display:flex;gap:8px;align-items:center;flex:none}
.cw-row{display:grid;grid-template-columns:76px 1fr 46px;gap:10px;align-items:center;margin-bottom:9px;font-size:12px}
.cw-label{color:var(--muted);font-weight:600}
.cw-bar{height:10px;background:var(--panel-2);border-radius:6px;overflow:hidden}
.cw-fill{height:100%;border-radius:6px;transition:width .3s}
.cw-count{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.trend-tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;max-width:420px}
.trend-tabs button{flex:1;padding:8px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted)}
.trend-tabs button.active{background:var(--accent);color:#fff}
.trend-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);margin-left:10px}
.trend-badge.up{color:var(--easy)}
.trend-badge.down{color:var(--interval)}
/* actual interval/tempo/fartlek logging */
.aw-setup{display:grid;grid-template-columns:1fr .6fr .85fr 1.3fr;gap:10px;align-items:end}
.aw-reps{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.aw-row{display:grid;grid-template-columns:32px 1fr 1fr;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.aw-row .awn{font-weight:800;color:var(--muted);font-size:12.5px;text-align:center}
.aw-row .awt{display:flex;align-items:center;gap:5px}
.aw-row .awt input{width:100%;min-width:0;text-align:center}
.aw-row .awp{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;text-align:right}
.aw-row .awp small{color:var(--muted);font-weight:600}
.aw-summary{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding:12px 14px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px}
.aw-summary div{font-size:12px;color:var(--muted)}
.aw-summary b{display:block;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;margin-top:2px}
@media(max-width:760px){.aw-setup{grid-template-columns:1fr 1fr}.aw-setup > div:last-child{grid-column:1/-1}}
.cal-cell.race-day{border-color:var(--race);border-width:2px}
.cal-cell .rest{position:absolute;bottom:7px;right:9px;font-size:10px;color:var(--muted)}

/* athletes */
.ath-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ath-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;cursor:pointer;transition:.15s;position:relative}
.ath-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.ath-card .top{display:flex;align-items:center;gap:13px;margin-bottom:16px}
.ath-card .av{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.ath-card .nm{font-weight:800;font-size:16px}
.ath-card .lv{font-size:12px;color:var(--muted);text-transform:capitalize}
.lvl-badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.lvl-beginner{background:rgba(52,211,153,.16);color:var(--easy)}
.lvl-intermediate{background:rgba(56,189,248,.16);color:var(--long)}
.lvl-elite{background:rgba(244,63,94,.16);color:var(--interval)}
.ath-stats{display:flex;gap:18px;padding-top:14px;border-top:1px solid var(--line)}
.ath-stats div .n{font-weight:800;font-size:17px}
.ath-stats div .l{font-size:11px;color:var(--muted)}
.goal-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.goal-row b{color:var(--accent-2)}
.ath-actions{display:flex;gap:8px;margin-top:14px}
.ath-actions .btn{flex:1;justify-content:center;padding:8px;font-size:12px}

/* plan compliance bar */
.compliance{margin-top:14px}
.compliance .bar{height:10px;background:var(--panel-2);border-radius:6px;overflow:hidden;position:relative}
.compliance .fill{height:100%;background:linear-gradient(90deg,var(--easy),var(--long));border-radius:6px;transition:width .4s}
.compliance .lbl{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,6,9,.72);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
body.light .modal-bg{background:rgba(30,40,60,.45)}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:640px;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.modal-head .close{font-size:22px;color:var(--muted);width:34px;height:34px;border-radius:9px}
.modal-head .close:hover{background:var(--panel-2);color:var(--text)}
.modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* form */
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--text);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.type-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.type-opt{padding:11px 6px;border-radius:11px;background:var(--panel-2);border:1.5px solid var(--line);text-align:center;font-size:12px;font-weight:700;transition:.12s}
.type-opt .ti{font-size:20px;display:block;margin-bottom:4px}
.type-opt.sel{border-color:var(--accent);background:rgba(255,107,53,.1)}
.mode-switch{display:flex;gap:8px;margin-bottom:18px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:5px}
.mode-switch button{flex:1;padding:10px;border-radius:8px;font-weight:700;font-size:13px;color:var(--muted);transition:.15s}
.mode-switch button.sel{background:var(--accent);color:#fff}
.rpe-row{display:flex;gap:6px}
.rpe-row .rp{flex:1;padding:9px 0;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);text-align:center;font-weight:700;font-size:13px}
.rpe-row .rp.sel{background:var(--accent);color:#fff;border-color:transparent}
.race-row{display:grid;grid-template-columns:1fr 160px 30px;gap:8px;align-items:center;margin-bottom:8px}
.race-row input{padding:9px 11px;font-size:13px}
.race-row .x{color:var(--muted);text-align:center;font-size:16px;border-radius:7px;height:100%}
.race-row .x:hover{color:var(--interval)}

/* workout builder */
.wb{background:var(--panel-2);border:1px dashed var(--line);border-radius:14px;padding:16px;margin-top:6px}
.wb-title{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.set-row{display:grid;grid-template-columns:52px 1fr 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:8px}
.set-row input{padding:8px 9px;font-size:13px}
.set-row .x{color:var(--muted);text-align:center;font-size:15px;border-radius:7px}
.set-row .x:hover{color:var(--interval)}
.set-labels{display:grid;grid-template-columns:52px 1fr 1fr 1fr 30px;gap:8px;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;padding:0 2px}
.add-set{font-size:12.5px;font-weight:700;color:var(--accent);padding:7px 0;margin-top:2px}
.wu-cd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.strides-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.strides-box select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);font-weight:700;font-size:13px;outline:none}
.strides-box input[type=number]{width:64px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);outline:none}
.strides-box input[type=text]{width:92px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);outline:none}
.strides-box select:focus,.strides-box input:focus{border-color:var(--accent)}

/* detail workout render */
.wk-block{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.wk-block .h{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.wk-set{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.wk-set:last-child{border:none}
.wk-set .rep{font-weight:800;color:var(--accent)}
.detail-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.detail-metrics .dm{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.detail-metrics .dm .n{font-size:20px;font-weight:800}
.detail-metrics .dm .l{font-size:11px;color:var(--muted);margin-top:2px}

.help{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel);border:1px solid var(--accent);color:var(--text);padding:13px 22px;border-radius:12px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);z-index:200;transition:.3s;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* share view */
.share-banner{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;padding:12px 20px;border-radius:14px;display:flex;align-items:center;gap:14px;margin-bottom:22px;box-shadow:var(--shadow);flex-wrap:wrap}
.share-banner .bt{font-weight:800;font-size:15px}
.share-banner .bs{font-size:12.5px;opacity:.9}
.share-banner .btn{margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.35)}
.share-hero{display:flex;align-items:center;gap:18px;margin-bottom:24px}
.share-hero .av{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff}
.share-hero .nm{font-size:26px;font-weight:800;letter-spacing:-.5px}
.body-share .sidebar,.body-share .topbar{display:none}
.body-share .content{max-width:1000px;padding-top:26px}

/* ===================== PLAN BUILDER ===================== */
.modal.wide{max-width:960px}
.bld-section{margin-bottom:24px}
.bld-section>.bld-legend{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:11px}
/* preset chips */
.preset-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.preset-chip{padding:12px 10px;border-radius:12px;background:var(--panel-2);border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);transition:.12s;text-align:center;line-height:1.35}
.preset-chip small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px}
.preset-chip:hover{border-color:var(--accent);color:var(--text)}
.preset-chip.sel{background:rgba(255,107,53,.12);border-color:var(--accent);color:var(--text)}
.preset-chip.sel small{color:var(--accent)}
/* setup: evenly aligned fields */
.builder-setup{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px}
.builder-setup .field{margin-bottom:0;display:flex;flex-direction:column}
.builder-setup .field label{min-height:30px;display:flex;align-items:flex-end;line-height:1.25}
.builder-setup .field input,.builder-setup .field select{height:42px}
/* weekly pattern day cards */
.pattern-editor{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.pat-day{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;gap:8px}
.pat-day .dow{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;text-align:center}
.pat-day select{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 4px;color:var(--text);font-size:11.5px;font-weight:700;outline:none;text-align:center;text-align-last:center}
.pat-day select:focus{border-color:var(--accent)}
/* the block grid — square, aligned, no cramped scroll */
.bgrid{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bgrid-head,.bgrid-row{display:grid;grid-template-columns:96px repeat(7,minmax(0,1fr)) 74px}
.bgrid-head{background:var(--panel-2);font-size:10.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.bgrid-head>div{padding:11px 4px;text-align:center;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.bgrid-head>div:first-child{justify-content:flex-start;padding-left:12px}
.bgrid-head>div:last-child{border-right:none}
.bgrid-row{border-top:1px solid var(--line)}
.bgrid-row>div{border-right:1px solid var(--line)}
.bgrid-row>div:last-child{border-right:none}
.bweek-label{display:flex;flex-direction:column;justify-content:center;gap:2px;font-weight:800;font-size:12.5px;background:var(--panel-2);padding:8px 12px;cursor:pointer;transition:.12s}
.bweek-label:hover{background:var(--line)}
.bweek-label .wl-date{font-weight:700;font-size:10.5px;color:var(--muted)}
.bweek-label .wl-phase{font-weight:800;font-size:10px;letter-spacing:.3px}
.ph-build{color:var(--easy)}
.ph-cutback{color:var(--long)}
.ph-taper{color:var(--fartlek)}
.bcell{cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;aspect-ratio:1/1;min-height:70px;transition:.1s;text-align:center;padding:6px 4px}
.bcell:hover{background:var(--panel-2)}
.bcell .ci{font-size:19px;line-height:1}
.bcell .cl{font-size:10px;font-weight:800;letter-spacing:.2px}
.bcell .ck{font-size:10px;color:var(--muted);font-weight:700}
.bcell.rest .ci{opacity:.4}
.bcell.rest .cl{color:var(--muted)}
.bweek-total{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;font-size:14px}
.bweek-total small{font-weight:700;color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.3px}
/* summary strip */
.builder-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.builder-summary .bs-card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;text-align:center}
.builder-summary .bs-card .bn{font-size:18px;font-weight:800;letter-spacing:-.3px}
.builder-summary .bs-card .bl{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}

@media(max-width:1000px){.stat-grid{grid-template-columns:repeat(2,1fr)}.detail-metrics{grid-template-columns:repeat(2,1fr)}
  .builder-setup{grid-template-columns:repeat(2,1fr)}.preset-row{grid-template-columns:repeat(2,1fr)}
  .builder-summary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.builder-setup{grid-template-columns:1fr 1fr}.pattern-editor{grid-template-columns:repeat(4,minmax(84px,1fr))}}
.hamburger{display:none;width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hamburger:hover{background:var(--panel-2)}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(5,6,9,.55);z-index:29}
.sidebar-backdrop.open{display:block}
@media(max-width:760px){
  .hamburger{display:flex}
  .sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .sidebar.open{transform:translateX(0)}
  .content{padding:18px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .type-picker{grid-template-columns:repeat(2,1fr)}
  .field-row,.field-row-3,.wu-cd{grid-template-columns:1fr}
  .cal-cell{min-height:70px}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">↑</div>
      <div>
        <h1>Elevate</h1>
        <span>your RUN</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="ic">📊</span> Dashboard</button>
      <button data-view="calendar"><span class="ic">📅</span> Calendar</button>
      <button data-view="plan"><span class="ic">📋</span> Plan Ahead</button>

    <button class="theme-btn" id="themeBtn"><span id="themeIcon">🌙</span> <span id="themeLabel">Dark mode</span></button>
    <button class="theme-btn" id="paceBtn" style="margin-top:8px">🧮 Pace Calculator</button>
    <div style="display:flex;gap:6px;margin:8px 4px 0">
      <button class="theme-btn" id="exportBtn" style="width:auto;flex:1;font-size:11.5px">⬇ Export</button>
      <button class="theme-btn" id="importBtn" style="width:auto;flex:1;font-size:11.5px">⬆ Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
    <div class="foot">
      Elevate your RUN · v2 prototype<br>Local data — nothing leaves your device.<br>Export regularly to avoid losing your log.<br>
      <a href="#" id="restoreBackupLink" style="color:var(--accent);font-weight:700">Having issues? Restore last backup</a>
    </div>

  <!-- MAIN -->

    <div class="content">
      <div class="view active" id="view-dashboard"></div>
      <div class="view" id="view-calendar"></div>
      <div class="view" id="view-plan"></div>

  <div class="modal" id="modal"></div>

<script>
/* ============================================================
   ELEVATE YOUR RUN — Coach Training Log
   Single-file vanilla JS. Data persists in localStorage.
   Features: multi-athlete, 7 run types, structured workout
   builder, calendar, streaks, progression charts, km/mi,
   PLAN-AHEAD prescribed workouts, ATHLETE SHARE view, LIGHT theme.
   ============================================================ */

/* ---------- Run type config ---------- */
const TYPES = {
  easy:     {label:'Easy Run',   icon:'🟢', color:'var(--easy)',     structured:false},
  tempo:    {label:'Tempo',      icon:'🔥', color:'var(--tempo)',    structured:true},
  interval: {label:'Intervals',  icon:'⚡', color:'var(--interval)', structured:true},
  fartlek:  {label:'Fartlek',    icon:'🎲', color:'var(--fartlek)',  structured:true},
  long:     {label:'Long Run',   icon:'🏔️', color:'var(--long)',     structured:false},
  race:     {label:'Race Day',   icon:'🏅', color:'var(--race)',     structured:false},
  rest:     {label:'Rest Day',   icon:'😴', color:'var(--recovery)', structured:false, isRest:true},
};
const SHORT_LABEL = {easy:'Easy',tempo:'Tempo',interval:'Intervals',fartlek:'Fartlek',long:'Long',race:'Race',rest:'Rest'};
const AVATAR_COLORS = ['#ff6b35','#38bdf8','#34d399','#a78bfa','#fbbf24','#f43f5e','#22d3ee','#f97316'];

/* ---------- State ---------- */
let state = {
  unit: 'km',
  theme: 'dark',
  activeAthlete: null,
  calMonth: new Date().getMonth(),
  calYear: new Date().getFullYear(),
  athletes: [],
  templates: [],
};
let shareMode = false;   // athlete read-only view
let currentView = 'dashboard';

/* ---------- Persistence ---------- */
// keep a one-generation-back safety copy on every successful save, so a bad write
// or a bug in migrate() can never permanently destroy the previous good state
function save(){
  if(linkMode) return;
  try{
    const prev=localStorage.getItem('elevate_v3');
    if(prev) localStorage.setItem('elevate_v3_backup', prev);
    localStorage.setItem('elevate_v3', JSON.stringify(state));
  }catch(e){
    console.error('Elevate: save failed', e);
    alert('⚠️ Your last change could not be saved (storage may be full). Please use Export now to back up your data, then free up space or clear old browser data.');
  }
}
function load(){
  const raw = localStorage.getItem('elevate_v3');
  if(!raw) return false;
  try{
    state = JSON.parse(raw);
    migrate();
    save();
    return true;
  }catch(e){
    // NEVER fall through to seed()+save() here — that would silently overwrite
    // real data with the demo set. Try the rolling backup instead; if that also
    // fails, surface the problem rather than destroying anything.
    console.error('Elevate: failed to load saved data', e);
    const backup = localStorage.getItem('elevate_v3_backup');
    if(backup){
      try{ state=JSON.parse(backup); migrate(); save(); alert('⚠️ Your most recent data failed to load, so the last automatic backup was restored instead. Please check your recent runs and use Export to back up.'); return true; }
      catch(e2){ console.error('Elevate: backup also failed to load', e2); }
    }
    alert('⚠️ Your saved data could not be loaded and has NOT been deleted — it is still in this browser\'s storage. Please contact support before doing anything else in this app, so it can be recovered.');
    state={unit:'km', theme:'dark', activeAthlete:null, athletes:[], calMonth:new Date().getMonth(), calYear:new Date().getFullYear()};
    return true;   // report "loaded" so boot() does not seed()/save() over the untouched raw data in localStorage
  }
}
// defensive: convert any legacy 'recovery' runs into rest days, and legacy single-race
// athletes into the races[] array (keeping goalRace/raceDate mirrored for old UI reads)
function migrate(){
  if(!Array.isArray(state.templates)) state.templates=[];
  (state.athletes||[]).forEach(a=>{
    (a.runs||[]).forEach(r=>{
      if(r.type==='recovery'){ r.type='rest'; r.distance=0; r.duration=0; r.workout=null; }
    });
    if(!Array.isArray(a.races)){
      a.races = a.goalRace ? [{id:uid(), name:a.goalRace, date:a.raceDate||''}] : [];
    }
    // legacy: earlier build stored a free-form {distanceKm,timeSec} paceRef —
    // convert to the {distKey,timeSec} benchmark format by nearest standard distance
    if(!a.benchmark && a.paceRef && a.paceRef.distanceKm && a.paceRef.timeSec){
      let best=RACE_DISTS[0], bestDiff=Infinity;
      RACE_DISTS.forEach(d=>{ const diff=Math.abs(d.m-a.paceRef.distanceKm*1000); if(diff<bestDiff){ bestDiff=diff; best=d; } });
      a.benchmark={distKey:best.k, timeSec:a.paceRef.timeSec};
    }
    delete a.paceRef;
    if(a.benchmark===undefined) a.benchmark=null;
    if(!Array.isArray(a.benchmarkHistory)){
      a.benchmarkHistory = a.benchmark ? [{id:uid(), distKey:a.benchmark.distKey, timeSec:a.benchmark.timeSec, date:todayISO()}] : [];
    }
    syncPrimaryRace(a);
  });
}
// pick the soonest upcoming race (or, if none upcoming, the most recent past one) and
// mirror it onto goalRace/raceDate so existing "days to race" widgets keep working unchanged
function syncPrimaryRace(a){
  const races=(a.races||[]).filter(r=>r.date).slice().sort((x,y)=>x.date.localeCompare(y.date));
  if(!races.length){ a.goalRace=''; a.raceDate=''; return; }
  const today=todayISO();
  const upcoming=races.find(r=>r.date>=today);
  const pick = upcoming || races[races.length-1];
  a.goalRace=pick.name; a.raceDate=pick.date;
}
function upcomingRaces(a){ const t=todayISO(); return (a.races||[]).filter(r=>r.date>=t).sort((x,y)=>x.date.localeCompare(y.date)); }

/* ---------- Backup: export / import ---------- */
function exportData(){
  const payload={app:'elevate-your-run',exportedAt:new Date().toISOString(),state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`elevate-your-run-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Backup downloaded ✓');
}
function importData(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming = parsed && parsed.state ? parsed.state : parsed;   // accept raw state too
      if(!incoming || !Array.isArray(incoming.athletes)) throw new Error('bad shape');
      if(!confirm('Importing will replace all current data in this browser with the backup file. Continue?')) return;
      state=incoming; migrate();
      if(!state.activeAthlete && state.athletes.length) state.activeAthlete=state.athletes[0].id;
      if(!state.theme) state.theme='dark';
      save(); applyTheme(); setView('dashboard');
      toast('Data imported ✓');
    }catch(e){ toast('Could not read that file — is it an Elevate backup?'); }
  };
  reader.readAsText(file);
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
// escape any user-entered text before it's dropped into innerHTML/attributes
const ESC_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>ESC_MAP[c]); }
const KM_PER_MI = 1.609344;
function toUnit(km){ return state.unit==='mi' ? km/KM_PER_MI : km; }
function unitLabel(){ return state.unit==='mi' ? 'mi' : 'km'; }
function fmtDist(km, dp=1){ return toUnit(km).toFixed(dp); }
function paceStr(km, min){
  if(!km || !min) return '—';
  const d = toUnit(km); if(d<=0) return '—';
  const p = min/d, m = Math.floor(p), s = Math.round((p-m)*60);
  return `${m}:${String(s).padStart(2,'0')}`;
}
function fmtDur(min){
  if(!min) return '—';
  const totalSec=Math.round(min*60);
  const h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
  return h>0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

/* ============================================================
   PACE CALCULATOR — Jack Daniels' VDOT model
   Given one recent race or hard time-trial result, estimate an
   aerobic-fitness score (VDOT) and derive accurate training paces
   for each intensity zone, plus equivalent race-time predictions.
   ============================================================ */
const RACE_DISTS=[
  {k:'1500',  label:'1500 m',  m:1500},
  {k:'mile',  label:'1 Mile',  m:1609.34},
  {k:'3k',    label:'3 K',     m:3000},
  {k:'5k',    label:'5 K',     m:5000},
  {k:'8k',    label:'8 K',     m:8000},
  {k:'10k',   label:'10 K',    m:10000},
  {k:'15k',   label:'15 K',    m:15000},
  {k:'half',  label:'Half Mar',m:21097.5},
  {k:'mar',   label:'Marathon',m:42195},
];
const PRED_DISTS=[{label:'1 Mile',m:1609.34},{label:'5K',m:5000},{label:'10K',m:10000},{label:'Half',m:21097.5},{label:'Marathon',m:42195}];
// training zones as a fraction of VDOT (calibrated to Daniels' tables)
const ZONES=[
  {k:'easy', name:'Easy / Long', frac:0.715, color:'var(--easy)',     purpose:'Aerobic base, recovery, long runs. Conversational.'},
  {k:'mar',  name:'Marathon',    frac:0.840, color:'var(--long)',     purpose:'Goal marathon effort. Steady, controlled.'},
  {k:'thr',  name:'Threshold',   frac:0.880, color:'var(--tempo)',    purpose:'Tempo / cruise intervals. "Comfortably hard." ~1hr race effort.'},
  {k:'int',  name:'Interval',    frac:0.975, color:'var(--interval)', purpose:'VO₂max. 3–5 min reps, equal-ish recovery. Hard.'},
  {k:'rep',  name:'Repetition',  frac:1.050, color:'var(--fartlek)',  purpose:'Speed & economy. 200–400 m fast, full recovery.'},
];
function vo2FromVel(v){ return -4.60 + 0.182258*v + 0.000104*v*v; }            // v = m/min
function pctMaxFromTime(tMin){ return 0.8 + 0.1894393*Math.exp(-0.012778*tMin) + 0.2989558*Math.exp(-0.1932605*tMin); }
function vdotFrom(distM,timeSec){ if(distM<=0||timeSec<=0) return 0; const t=timeSec/60; const v=distM/t; return vo2FromVel(v)/pctMaxFromTime(t); }
function velFromVo2(vo2){ const a=0.000104,b=0.182258,c=-4.60-vo2; const disc=b*b-4*a*c; if(disc<0) return 0; return (-b+Math.sqrt(disc))/(2*a); } // m/min
function zonePaceSecPerKm(vdot,frac){ const v=velFromVo2(frac*vdot); return v>0 ? (1000/v)*60 : 0; }
// zone pace, with marathon special-cased to the marathon race prediction (keeps "M pace" == predicted marathon pace)
function zonePace(vdot,z){ if(z.k==='mar'){ return predictTime(42195,vdot)/42.195; } return zonePaceSecPerKm(vdot,z.frac); }
// predict race time (sec) for a distance at a given VDOT — numeric solve, self-consistent with the model above
function predictTime(distM,vdot){ let lo=1,hi=36000; for(let i=0;i<60;i++){ const mid=(lo+hi)/2; (vdotFrom(distM,mid)>vdot)?(lo=mid):(hi=mid); } return (lo+hi)/2; }
// format seconds -> m:ss (for pace) always per current display unit
function paceSecToStr(secPerKm){ if(!secPerKm||secPerKm<=0) return '—'; const per = state.unit==='mi' ? secPerKm*KM_PER_MI : secPerKm; const m=Math.floor(per/60),s=Math.round(per%60); return `${m}:${String(s).padStart(2,'0')}`; }
// format seconds -> h:mm:ss or m:ss for race times
function secToClock(sec){ sec=Math.round(sec); const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60; return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`; }
// split time for a rep of a given distance in metres, at a sec/km pace
function splitFor(secPerKm,metres){ const sec=secPerKm*(metres/1000); return secToClock(sec); }
// warm-up / cool-down input: a single Time-or-Distance choice instead of two ambiguous boxes
function warmCoolFieldHTML(prefix, val, mode){
  return `<div style="display:flex;gap:8px;align-items:center">
    <select id="${prefix}-mode" onchange="toggleWuCdMode('${prefix}')" style="max-width:118px;flex:none">
      <option value="time" ${mode==='time'?'selected':''}>⏱ Time</option>
      <option value="dist" ${mode==='dist'?'selected':''}>📏 Distance</option>
    </select>
    <input type="number" step="1" min="0" id="${prefix}-dur" value="${val.dur||''}" placeholder="minutes" oninput="syncWuCdField('${prefix}','dur')" style="display:${mode==='time'?'block':'none'};flex:1">
    <input type="number" step="0.1" min="0" id="${prefix}-dist" value="${val.dist||''}" placeholder="km" oninput="syncWuCdField('${prefix}','dist')" style="display:${mode==='dist'?'block':'none'};flex:1">
  </div>`;
}
function toggleWuCdMode(prefix){
  const mode=$('#'+prefix+'-mode').value;
  const target = prefix==='wu' ? draftWarmup : draftCooldown;
  target.mode = mode;
  $('#'+prefix+'-dur').style.display = mode==='time'?'block':'none';
  $('#'+prefix+'-dist').style.display = mode==='dist'?'block':'none';
  recalcActualTotals();
}
function syncWuCdField(prefix, key){
  const target = prefix==='wu' ? draftWarmup : draftCooldown;
  const el = $('#'+prefix+'-'+key);
  target[key] = key==='dist' ? (parseFloat(el.value)||0) : (parseInt(el.value)||0);
  recalcActualTotals();
}
// consistent display for a warm-up/cool-down value wherever it's shown (run detail, etc.)
function fmtWarmCool(w){
  if(!w) return '—';
  const hasDist=w.dist>0, hasDur=w.dur>0;
  if(hasDist && hasDur) return `${w.dist} km · ${w.dur} min easy`;
  if(hasDist) return `${w.dist} km easy`;
  if(hasDur) return `${w.dur} min easy`;
  return '—';
}
// convert a rep distance entered as m/km/mi into internal km
function repDistToKm(value,unit){ if(!value) return 0; if(unit==='m') return value/1000; if(unit==='mi') return value*KM_PER_MI; return value; }

/* ---------- Workout templates (reusable prescribed structures) ---------- */
function saveAsTemplate(){
  const validSets = draftSets.filter(s=>s.effort);
  if(!validSets.length){ toast('Add at least one set first'); return; }
  const name = prompt('Name this template (e.g. "Tuesday 6x800m"):', `${SHORT_LABEL[draftType]} · ${validSets[0].reps}×${validSets[0].effort}`);
  if(!name || !name.trim()) return;
  state.templates.push({
    id: uid(), name: name.trim(), type: draftType,
    warmup: {...draftWarmup}, cooldown: {...draftCooldown},
    sets: JSON.parse(JSON.stringify(validSets)),
    createdAt: todayISO(),
  });
  save();
  toast('Template saved ✓');
}
function openTemplateLibrary(){
  const list = state.templates.filter(t=>t.type===draftType);
  const other = state.templates.filter(t=>t.type!==draftType);
  const rowHTML = t => `<div class="tmpl-row">
      <div class="tmpl-info"><div class="tmpl-name">${TYPES[t.type].icon} ${esc(t.name)}</div>
        <div class="tmpl-meta">${t.sets.map(s=>`${s.reps}×${esc(s.effort)}`).join(' + ')}</div></div>
      <div class="tmpl-actions"><button class="pc-open-btn" onclick="useTemplate('${t.id}')">Use</button><button class="run-del" onclick="deleteTemplate('${t.id}')" title="Delete">🗑</button></div>
    </div>`;
  openModal(`
    <div class="modal-head"><h2>📋 Workout templates</h2><button class="close" onclick="backToWorkout()">×</button></div>
    <div class="modal-body">
      ${list.length? `<div class="bld-section"><span class="bld-legend">${TYPES[draftType].label} templates</span><div class="tmpl-list">${list.map(rowHTML).join('')}</div></div>` : `<div class="help">No saved ${TYPES[draftType].label.toLowerCase()} templates yet — build a session below, then "Save as template".</div>`}
      ${other.length? `<div class="bld-section" style="margin-top:${list.length?'16px':'0'}"><span class="bld-legend">Other types</span><div class="tmpl-list">${other.map(rowHTML).join('')}</div></div>` : ''}
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="backToWorkout()">← Back to workout</button></div>`, true);
}
function useTemplate(id){
  const t=state.templates.find(x=>x.id===id); if(!t) return;
  draftType=t.type;
  draftSets=JSON.parse(JSON.stringify(t.sets));
  draftWarmup={...t.warmup};
  draftCooldown={...t.cooldown};
  toast(`Loaded "${t.name}" ✓`);
  backToWorkout();
}
function deleteTemplate(id){
  const t=state.templates.find(x=>x.id===id); if(!t) return;
  if(!confirm(`Delete template "${t.name}"?`)) return;
  state.templates=state.templates.filter(x=>x.id!==id);
  save();
  openTemplateLibrary();
}

/* ---------- Pace Calculator modal + inline workout helper ---------- */
let pcState=null;     // {distKey, timeSec, date, athleteId, fromWorkout}
function benchToPc(a){ const b=a&&a.benchmark; return b?{distKey:b.distKey,timeSec:b.timeSec}:{distKey:'5k',timeSec:1500}; }
function openPaceCalc(athleteId, fromWorkout){
  const a = athleteId ? state.athletes.find(x=>x.id===athleteId) : currentAthlete();
  if(!a){ toast('Add an athlete first'); setView('athletes'); return; }
  const base=benchToPc(a);
  pcState={distKey:base.distKey, timeSec:base.timeSec, date:todayISO(), athleteId:a.id, fromWorkout:!!fromWorkout};
  renderPaceCalc();
}
function pcTimeParts(sec){ return {h:Math.floor(sec/3600), m:Math.floor((sec%3600)/60), s:Math.round(sec%60)}; }
function renderPaceCalc(){
  const a=state.athletes.find(x=>x.id===pcState.athleteId);
  const distOpts=RACE_DISTS.map(d=>`<option value="${d.k}" ${d.k===pcState.distKey?'selected':''}>${d.label}</option>`).join('');
  const tp=pcTimeParts(pcState.timeSec);
  const hist=(a.benchmarkHistory||[]).slice().sort((x,y)=>y.date.localeCompare(x.date));
  const histHTML = hist.length ? `<div class="bld-section"><span class="bld-legend">Result history <span style="text-transform:none;letter-spacing:0;font-weight:600">— powers the Fitness trend on Progression</span></span>
    <div class="pc-hist">${hist.map(h=>{ const d=RACE_DISTS.find(x=>x.k===h.distKey); return `<div class="pc-hist-row"><span class="phd">${fmtDate(h.date)}</span><span>${d?d.label:h.distKey}</span><span class="phv">${secToClock(h.timeSec)}</span><button class="run-del" onclick="deleteBenchmark('${h.id}')" title="Delete">🗑</button></div>`; }).join('')}</div></div>` : '';
  openModal(`
    <div class="modal-head"><h2>🧮 Pace Calculator — ${esc(a.name.split(' ')[0])}</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="bld-section">
        <span class="bld-legend">Enter a recent race or goal result</span>
        <div class="pc-input">
          <div class="field" style="margin:0"><label>Distance</label><select id="pc-dist" onchange="pcSet()">${distOpts}</select></div>
          <div class="field" style="margin:0"><label>Hours</label><input type="number" min="0" max="9" id="pc-h" value="${tp.h}" oninput="pcSet()"></div>
          <div class="field" style="margin:0"><label>Minutes</label><input type="number" min="0" max="59" id="pc-m" value="${tp.m}" oninput="pcSet()"></div>
          <div class="field" style="margin:0"><label>Seconds</label><input type="number" min="0" max="59" id="pc-s" value="${tp.s}" oninput="pcSet()"></div>
        </div>
        <div class="field" style="margin-top:10px;max-width:220px"><label>Date of this result</label><input type="date" id="pc-date" value="${pcState.date}" onchange="pcSet()"></div>
      </div>
      <div id="pc-out"></div>
      ${histHTML}
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" style="margin-right:auto" onclick="savePaceBenchmark()">💾 Save as ${esc(a.name.split(' ')[0])}'s benchmark</button>
      ${pcState.fromWorkout?`<button class="btn btn-ghost" onclick="backToWorkout()">← Back to workout</button>`:''}
      <button class="btn btn-primary" onclick="closeModal()">Done</button>
    </div>`, true);
  renderPaceOut();
}
function pcSet(){
  const dk=$('#pc-dist').value, h=parseInt($('#pc-h').value)||0, m=parseInt($('#pc-m').value)||0, s=parseInt($('#pc-s').value)||0;
  pcState.distKey=dk; pcState.timeSec=h*3600+m*60+s; pcState.date=$('#pc-date').value||todayISO(); renderPaceOut();
}
function renderPaceOut(){
  const el=$('#pc-out'); if(!el) return;
  const dist=RACE_DISTS.find(x=>x.k===pcState.distKey); const vdot=vdotFrom(dist.m,pcState.timeSec);
  if(!vdot||pcState.timeSec<=0){ el.innerHTML=`<div class="help" style="margin-top:14px">Enter a valid time to see paces.</div>`; return; }
  const racePace=paceSecToStr(pcState.timeSec/(dist.m/1000));
  const rows=ZONES.map(z=>{
    const sp=zonePace(vdot,z);
    const per=paceSecToStr(sp);
    const s400=splitFor(sp,400), s1k=splitFor(sp,1000), s800=splitFor(sp,800);
    const split = (z.k==='rep')?`400m ${s400} · 200m ${splitFor(sp,200)}` : (z.k==='int')?`400m ${s400} · 800m ${s800}`:(z.k==='thr')?`1km ${s1k} · mile ${splitFor(sp,1609.34)}`:`1km ${s1k}`;
    const useBtn=pcState.fromWorkout?`<button class="pace-use" onclick="usePace('${z.k}','${per}')">Use</button>`:'';
    return `<tr><td><div class="zone"><span class="zdot" style="background:${z.color}"></span>${z.name}</div><div class="zp">${z.purpose}</div></td><td class="pace-val">${per}<span class="zp"> /${unitLabel()}</span></td><td class="split">${split}</td><td style="text-align:right">${useBtn}</td></tr>`;
  }).join('');
  const preds=PRED_DISTS.map(p=>`<div class="pred-card"><div class="pd">${p.label}</div><div class="pt">${secToClock(predictTime(p.m,vdot))}</div></div>`).join('');
  el.innerHTML=`
    <div class="pc-vdot"><div><div class="vnum">${vdot.toFixed(0)}</div><div class="vlab">VDOT</div></div><div class="vdesc">Fitness score from your <b>${dist.label}</b> in <b>${secToClock(pcState.timeSec)}</b> (${racePace}/${unitLabel()} race pace).<br>All training paces &amp; race predictions below are derived from this.</div></div>
    <div class="bld-section"><span class="bld-legend">Training paces (per ${unitLabel()})</span>
      <table class="pace-table"><thead><tr><th>Zone</th><th>Pace</th><th>Splits</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="pace-legend">
        <div class="pl"><b>Tempo = Threshold.</b> Prescribe tempo runs &amp; cruise intervals at this pace.</div>
        <div class="pl"><b>Intervals = VO₂max.</b> 3–5 min reps (e.g. 800–1200 m) at Interval pace.</div>
        <div class="pl"><b>Fartlek:</b> surge at Interval/Rep pace, float at Easy between.</div>
        <div class="pl"><b>Reps:</b> short &amp; fast (200–400 m) for speed &amp; economy, full recovery.</div>
      </div>
    </div>
    <div class="bld-section" style="margin-bottom:4px"><span class="bld-legend">Equivalent race predictions</span><div class="pred-grid">${preds}</div>
      <div class="help">Predictions assume equal fitness &amp; specific training for each distance (Daniels model).</div></div>`;
}
function savePaceBenchmark(){
  const a=state.athletes.find(x=>x.id===pcState.athleteId); if(!a) return;
  if(!Array.isArray(a.benchmarkHistory)) a.benchmarkHistory=[];
  const dateVal=pcState.date||todayISO();
  // if a result already exists for this exact date, update it rather than duplicating
  const existing=a.benchmarkHistory.find(h=>h.date===dateVal);
  if(existing){ existing.distKey=pcState.distKey; existing.timeSec=pcState.timeSec; }
  else { a.benchmarkHistory.push({id:uid(), distKey:pcState.distKey, timeSec:pcState.timeSec, date:dateVal}); }
  a.benchmarkHistory.sort((x,y)=>x.date.localeCompare(y.date));
  a.benchmark=a.benchmarkHistory[a.benchmarkHistory.length-1];   // "current" = most recent by date
  save();
  toast('Benchmark saved for '+a.name.split(' ')[0]+' ✓');
  if($('#paceHelperWrap') && a.id===currentAthlete()?.id) $('#paceHelperWrap').innerHTML=paceHelperHTML(a);
  renderPaceCalc();
}
function deleteBenchmark(id){
  const a=state.athletes.find(x=>x.id===pcState.athleteId); if(!a) return;
  a.benchmarkHistory=(a.benchmarkHistory||[]).filter(h=>h.id!==id);
  a.benchmark=a.benchmarkHistory.length ? a.benchmarkHistory[a.benchmarkHistory.length-1] : null;
  save(); renderPaceCalc(); toast('Result removed');
}
// return to the run/workout modal this pace calculator was opened from, preserving in-progress sets
function backToWorkout(){
  if(runModalCtx) openRunModal(runModalCtx.dateISO, runModalCtx.editId, runModalCtx.forceMode, true);
  else closeModal();
}
// insert a pace into the workout builder's set targets — used both by the compact
// inline helper (same modal, live DOM) and the full calculator (may have replaced
// the run modal's DOM, so this always updates draftSets directly first)
function usePace(zoneKey, paceStr){
  const val=paceStr+'/'+unitLabel();
  draftSets.forEach(s=>{ if(!s.target || !s.target.trim() || s.autofill==='1'){ s.target=val; s.autofill='1'; } });
  if(document.querySelector('#setRows')) renderSetRows();
  toast(`${ZONES.find(z=>z.k===zoneKey).name} pace ${val} applied to sets ✓`);
}
// compact pace helper shown inline inside the prescribe/log workout builder & plan builder
function paceHelperHTML(a){
  if(!a.benchmark) return `<div class="pace-helper"><div class="ph-h"><span>🎯 Target paces</span><button class="pc-open-btn" onclick="openPaceCalc('${a.id}',true)">🧮 Set benchmark</button></div><div class="help" style="margin:0">No fitness benchmark yet — open the calculator to generate ${esc(a.name.split(' ')[0])}'s training paces.</div></div>`;
  const dist=RACE_DISTS.find(x=>x.k===a.benchmark.distKey); const vdot=vdotFrom(dist.m,a.benchmark.timeSec);
  const chips=ZONES.filter(z=>['thr','int','rep','mar'].includes(z.k)).map(z=>{ const per=paceSecToStr(zonePace(vdot,z)); return `<button class="pace-chip" onclick="usePace('${z.k}','${per}')" title="Insert ${z.name} pace into set targets"><span class="cdot" style="background:${z.color}"></span>${z.name} <span class="cv">${per}/${unitLabel()}</span></button>`; }).join('');
  return `<div class="pace-helper"><div class="ph-h"><span>🎯 Target paces · VDOT ${vdot.toFixed(0)}</span><button class="pc-open-btn" onclick="openPaceCalc('${a.id}',true)">🧮 Full calculator</button></div><div class="pace-chips">${chips}</div><div class="help" style="margin-top:9px">Click a pace to drop it into the set targets above.</div></div>`;
}

function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(iso){ return parseISO(iso).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'}); }
function isFuture(iso){ const d=parseISO(iso); d.setHours(23,59,59); return d>new Date(); }
function isPast(iso){ const d=parseISO(iso); d.setHours(23,59,59); return d<new Date(); }
function weekKey(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3);
  const first=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const wk=1+Math.round(((d-first)/86400000-3+((first.getUTCDay()+6)%7))/7);
  return `${d.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`;
}
function avatarColor(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))%AVATAR_COLORS.length; return AVATAR_COLORS[h]; }
function initials(name){ return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function currentAthlete(){ return state.athletes.find(a=>a.id===state.activeAthlete) || state.athletes[0]; }
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
// completed runs only (exclude planned prescriptions)
function doneRuns(a){ return a.runs.filter(r=>r.status!=='planned'); }
function plannedRuns(a){ return a.runs.filter(r=>r.status==='planned'); }

/* ---------- Seed data ---------- */
function addDays(iso,n){ const d=parseISO(iso); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function mondayOffset(daysBack){
  const d=new Date(); d.setDate(d.getDate()+daysBack);
  const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dayFrom(iso,n){ return addDays(iso,n); }

function seed(){
  const mk = (name, level, races, target) => {
    const a = { id: uid(), name, level, weeklyTarget: target, runs: [], races };
    syncPrimaryRace(a);
    return a;
  };
  const a1 = mk('Jordan Reyes','beginner',[
    {id:uid(), name:'First 5K', date:addDays(todayISO(),46)}
  ], 20);
  const a2 = mk('Priya Anand','intermediate',[
    {id:uid(), name:'Tune-up 10K', date:addDays(todayISO(),30)},
    {id:uid(), name:'Half Marathon', date:addDays(todayISO(),72)}
  ], 55);
  const a3 = mk('Marcus Webb','elite',[
    {id:uid(), name:'Tune-up Half', date:addDays(todayISO(),55)},
    {id:uid(), name:'Marathon PB', date:addDays(todayISO(),110)}
  ], 110);
  seedRuns(a1,'beginner'); seedRuns(a2,'intermediate'); seedRuns(a3,'elite');
  seedPlan(a1,'beginner'); seedPlan(a2,'intermediate'); seedPlan(a3,'elite');
  state.athletes=[a1,a2,a3];
  state.activeAthlete=a1.id;
}
function seedRuns(a, level){
  const base = level==='beginner'?3.5 : level==='intermediate'?9 : 16;
  const weeks = 10;
  for(let w=weeks; w>=0; w--){
    const growth = 1 + (weeks-w)*0.05;
    const monday = mondayOffset(-w*7);
    pushRun(a, dayFrom(monday,0), 'easy', base*growth, base*growth*(level==='elite'?4.6:6.2), 3);
    if(level!=='beginner') attachStrides(a,'strides',6,'100m');   // strides after the easy run
    if(level!=='beginner') pushStructured(a, dayFrom(monday,2), 'interval', level, growth);
    else if(w%2===0) pushRun(a, dayFrom(monday,2),'easy', (base*0.8)*growth, (base*0.8)*growth*6.5, 3);
    if(level==='elite') pushStructured(a, dayFrom(monday,4),'tempo',level,growth);
    else if(level==='intermediate') pushStructured(a, dayFrom(monday,4),'fartlek',level,growth);
    const lr = base*(level==='beginner'?1.6:level==='intermediate'?2.0:2.3)*growth;
    // don't seed a long run that lands in the future
    if(isPast(dayFrom(monday,6)) || dayFrom(monday,6)<=todayISO()){
      pushRun(a, dayFrom(monday,6),'long', lr, lr*(level==='elite'?4.9:7.2), level==='elite'?5:4);
      if(level==='elite') attachStrides(a,'hills',8,'10s');       // hill sprints after long run
      else if(level==='intermediate') attachStrides(a,'strides',4,'100m');
    }
    if(level==='elite') pushRun(a, dayFrom(monday,5),'rest', 0, 0, null);   // genuine day off
  }
}
function attachStrides(a, mode, count, length){
  const r=a.runs[a.runs.length-1]; if(r) r.strides={mode,count,length};
}
// prescribe next 2 weeks of workouts (status:'planned')
function seedPlan(a, level){
  const base = level==='beginner'?3.5 : level==='intermediate'?9 : 16;
  const growth = 1.5;
  for(let w=0; w<2; w++){
    const start = mondayOffset(0); // this monday
    const wkMon = addDays(start, 7*(w+1)); // next mondays
    planRun(a, addDays(wkMon,0),'easy', base*growth, base*growth*(level==='elite'?4.6:6.2), 'Keep it conversational — nose-breathing pace.');
    if(level!=='beginner') attachStrides(a,'strides',6,'100m');
    if(level!=='beginner') planStructured(a, addDays(wkMon,2),'interval',level,growth,'Hit target splits; full recovery between reps.');
    else planRun(a, addDays(wkMon,2),'easy', base*0.8*growth, base*0.8*growth*6.5,'Optional — walk breaks are fine.');
    if(level==='elite') planStructured(a, addDays(wkMon,4),'tempo',level,growth,'Comfortably hard, controlled breathing.');
    else if(level==='intermediate') planStructured(a, addDays(wkMon,4),'fartlek',level,growth,'Play with pace — surge on the uphills.');
    if(level==='elite') planRun(a, addDays(wkMon,5),'rest',0,0,'Full rest — sleep, hydrate, let the work absorb.');
    const lr = base*(level==='beginner'?1.6:level==='intermediate'?2.0:2.3)*growth;
    planRun(a, addDays(wkMon,6),'long', lr, lr*(level==='elite'?4.9:7.2),'Fuel every 40 min. Negative-split the back half.');
    if(level==='elite') attachStrides(a,'hills',8,'10s'); else if(level==='intermediate') attachStrides(a,'strides',4,'100m');
  }
}
function pushRun(a,date,type,km,min,rpe,notes=''){
  a.runs.push({id:uid(),date,type,distance:+km.toFixed(2),duration:+min.toFixed(0),rpe,notes,workout:null,status:'done'});
}
function planRun(a,date,type,km,min,coachNote=''){
  a.runs.push({id:uid(),date,type,distance:+km.toFixed(2),duration:+min.toFixed(0),rpe:null,notes:'',coachNote,workout:null,status:'planned'});
}
function buildWorkout(type,level,growth){
  let wu,cd,sets;
  if(type==='interval'){
    const reps = level==='elite'?6:level==='intermediate'?5:4;
    wu={dist:2,dur:12}; cd={dist:1.5,dur:9};
    sets=[{reps, effort:'400m', target: level==='elite'?'75s':'95s', rest:'90s jog'}];
    if(level==='elite') sets.push({reps:4,effort:'200m',target:'34s',rest:'60s'});
  } else if(type==='tempo'){
    wu={dist:2.5,dur:14}; cd={dist:2,dur:12};
    sets=[{reps:1,effort:(4*growth).toFixed(1)+'km',target:'threshold',rest:'—'}];
  } else {
    wu={dist:2,dur:11}; cd={dist:1.5,dur:9};
    sets=[{reps:6,effort:'2min',target:'hard',rest:'2min easy'}];
  }
  const totalKm = wu.dist+cd.dist + (type==='tempo'?4*growth:(sets[0].reps*0.4));
  const totalMin = wu.dur+cd.dur + (type==='tempo'?20*growth:24);
  return {wu,cd,sets,totalKm,totalMin};
}
function pushStructured(a,date,type,level,growth){
  const {wu,cd,sets,totalKm,totalMin}=buildWorkout(type,level,growth);
  a.runs.push({id:uid(),date,type,distance:+totalKm.toFixed(2),duration:+totalMin.toFixed(0),
    rpe:level==='elite'?7:6,notes:'',workout:{warmup:wu,cooldown:cd,sets},status:'done'});
}
function planStructured(a,date,type,level,growth,coachNote){
  const {wu,cd,sets,totalKm,totalMin}=buildWorkout(type,level,growth);
  a.runs.push({id:uid(),date,type,distance:+totalKm.toFixed(2),duration:+totalMin.toFixed(0),
    rpe:null,notes:'',coachNote,workout:{warmup:wu,cooldown:cd,sets},status:'planned'});
}

/* ---------- Aggregations (completed only) ---------- */
function runsInRange(list, from, to){ return list.filter(r=>{ const d=parseISO(r.date); return d>=from && d<=to; }); }
function sumDist(runs){ return runs.reduce((s,r)=>s+r.distance,0); }
function sumDur(runs){ return runs.reduce((s,r)=>s+r.duration,0); }
function weekStats(a){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const start=new Date(now); start.setDate(now.getDate()-day); start.setHours(0,0,0,0);
  const end=new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59);
  const prevStart=new Date(start); prevStart.setDate(start.getDate()-7);
  const prevEnd=new Date(start); prevEnd.setDate(start.getDate()-1); prevEnd.setHours(23,59,59);
  const done=doneRuns(a);
  return {cur:runsInRange(done,start,end), prev:runsInRange(done,prevStart,prevEnd), start, end,
          planned:runsInRange(plannedRuns(a),start,end)};
}
function monthDist(a){
  const n=new Date(); const from=new Date(n.getFullYear(),n.getMonth(),1);
  const to=new Date(n.getFullYear(),n.getMonth()+1,0,23,59,59);
  return sumDist(runsInRange(doneRuns(a),from,to));
}
function yearDist(a){
  const n=new Date(); const from=new Date(n.getFullYear(),0,1);
  const to=new Date(n.getFullYear(),11,31,23,59,59);
  return sumDist(runsInRange(doneRuns(a),from,to));
}
function streak(a){
  const keys=new Set(doneRuns(a).map(r=>weekKey(parseISO(r.date))));
  let cur=0, probe=new Date();
  for(let i=0;i<520;i++){ const k=weekKey(probe); if(keys.has(k)) cur++; else break; probe.setDate(probe.getDate()-7); }
  const sorted=[...keys].sort();
  let longest=0,run=0,prevWk=null;
  for(const k of sorted){ if(prevWk && isNextWeek(prevWk,k)) run++; else run=1; longest=Math.max(longest,run); prevWk=k; }
  return {current:cur,longest};
}
function isNextWeek(a,b){
  const [ya,wa]=a.split('-W').map(Number),[yb,wb]=b.split('-W').map(Number);
  if(ya===yb) return wb===wa+1;
  return yb===ya+1 && wa>=52 && wb===1;
}

function runsInMonth(a){

/* ---------- SVG ring & charts ---------- */
function ringSVG(val,max){
  const pct=Math.min(val/max,1), r=42, c=2*Math.PI*r, off=c*(1-pct);
  return `<div class="ring"><svg width="96" height="96" viewBox="0 0 96 96">
      <circle cx="48" cy="48" r="${r}" fill="none" stroke="var(--panel-2)" stroke-width="9"/>
      <circle cx="48" cy="48" r="${r}" fill="none" stroke="url(#g)" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 48 48)"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff6b35"/><stop offset="1" stop-color="#ffb703"/></linearGradient></defs>
    </svg><div class="val">${val}</div></div>`;
}
function drawWeekDots(a){
  const el=$('#weekDots'); if(!el) return;
  const keys=new Set(doneRuns(a).map(r=>weekKey(parseISO(r.date))));
  let html='';
  for(let i=7;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i*7);
    const hit=keys.has(weekKey(d)); html+=`<div class="d ${hit?'hit':''}">${hit?'✓':''}</div>`; }
  el.innerHTML=html;
}
function last12Weeks(a){
  const arr=[]; const done=doneRuns(a);
  for(let i=11;i>=0;i--){
    const d=new Date(); const day=(d.getDay()+6)%7;
    d.setDate(d.getDate()-day-i*7); d.setHours(0,0,0,0);
    const end=new Date(d); end.setDate(d.getDate()+6); end.setHours(23,59,59);
    arr.push({label:`${d.getMonth()+1}/${d.getDate()}`,dist:sumDist(runsInRange(done,d,end))});
  }
  return arr;
}
function drawVolChart(a,id){
  const el=$('#'+id); if(!el) return;
  const data=last12Weeks(a); const W=el.clientWidth||560,H=180,pad=26;
  const maxV=Math.max(toUnit(a.weeklyTarget||0),...data.map(d=>toUnit(d.dist)),1)*1.15;
  const bw=(W-pad*2)/data.length;
  const targetY=a.weeklyTarget?H-pad-(toUnit(a.weeklyTarget)/maxV)*(H-pad*2):null;
  let bars='';
  data.forEach((d,i)=>{
    const v=toUnit(d.dist), h=(v/maxV)*(H-pad*2), x=pad+i*bw+bw*0.18, w=bw*0.64, y=H-pad-h;
    bars+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,0)}" rx="4" fill="url(#bg)"><title>${d.label}: ${v.toFixed(1)} ${unitLabel()}</title></rect>`;
    if(i%2===0||i===data.length-1) bars+=`<text x="${pad+i*bw+bw/2}" y="${H-8}" fill="var(--muted)" font-size="9.5" text-anchor="middle">${d.label}</text>`;
    if(v>0) bars+=`<text x="${pad+i*bw+bw/2}" y="${y-4}" fill="var(--muted)" font-size="9" text-anchor="middle">${v.toFixed(0)}</text>`;
  });
  const tl=targetY!=null?`<line x1="${pad}" y1="${targetY}" x2="${W-pad}" y2="${targetY}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"/>`:'';
  el.innerHTML=`<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff6b35"/></linearGradient></defs>
    ${tl}${bars}</svg>`;
}

function weekLabel(d){
  const day=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-day);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const now=new Date(); const cday=(now.getDay()+6)%7; const cmon=new Date(now); cmon.setDate(now.getDate()-cday); cmon.setHours(0,0,0,0);
  const diff=Math.round((mon-cmon)/(7*86400000));
  const prefix = diff===0?'This week · ':diff===1?'Next week · ':diff>1?`In ${diff} weeks · `:'';
  return prefix + mon.toLocaleDateString('en-CA',{month:'short',day:'numeric'}) + ' – ' + sun.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
}
function planCompliance(a){
  // look at planned sessions whose date is in the last 28 days (past); did a done run happen that day (+/-1)?
  const now=new Date(); const from=new Date(now); from.setDate(now.getDate()-28);
  const pastPlanned=plannedRuns(a).filter(r=>{const d=parseISO(r.date); return d>=from && d<now;});
  const done=doneRuns(a);
  let hit=0;
  pastPlanned.forEach(p=>{ if(done.some(d=>Math.abs(parseISO(d.date)-parseISO(p.date))<=86400000)) hit++; });
  const planned=pastPlanned.length;
  return {planned, done:hit, pct: planned?Math.round(hit/planned*100):100};
}
// weekly breakdown of prescribed-vs-completed, for the Compliance card — only
// includes weeks that actually had something prescribed and are now in the past
function weeklyCompliance(a, numWeeks){
  numWeeks = numWeeks||8;
  const doneList=doneRuns(a);
  const allPlanned=plannedRuns(a);
  const todayMon=mondayOf(todayISO());
  const weeks=[];
  for(let i=numWeeks-1;i>=0;i--){
    const wStart=addDays(todayMon,-7*i);
    const wEnd=addDays(wStart,6);
    const weekPlanned=allPlanned.filter(r=> r.date>=wStart && r.date<=wEnd && r.date<todayISO());
    if(!weekPlanned.length) continue;
    let hit=0;
    weekPlanned.forEach(p=>{ if(doneList.some(d=>Math.abs(parseISO(d.date)-parseISO(p.date))<=86400000)) hit++; });
    weeks.push({weekStart:wStart, planned:weekPlanned.length, done:hit, pct:Math.round(hit/weekPlanned.length*100)});
  }
  return weeks;
}

// per-type volume weight & pace (min per km) for auto-distribution
const BLD_WEIGHT={easy:1,rest:0,tempo:1.1,interval:1.0,fartlek:1.0,long:1.9,race:1.2};

function levelPaceMult(level){ return level==='elite'?0.80:level==='intermediate'?0.92:1.06; }

const LEVEL_PATTERN={
  beginner:    ['easy','rest','easy','rest','easy','rest','long'],

  elite:       ['easy','easy','interval','easy','tempo','rest','long'],

// compute the whole block: array of {vol, phase, days:[{type,dist,dur}]}
function computeBlock(){
  const b=builderState;
  const peakIdx=Math.max(0,b.weeks-1-b.taper);
  const peakVol=b.baseVolume*(1+(b.rampPct/100)*peakIdx);
  const weeks=[];
  for(let i=0;i<b.weeks;i++){
    let vol,phase;
    if(i<=peakIdx){
      vol=b.baseVolume*(1+(b.rampPct/100)*i);
      phase='build';
      if(b.cutbackEvery>0 && (i+1)%b.cutbackEvery===0 && i!==peakIdx){ vol*=(1-b.cutbackPct/100); phase='cutback'; }
    } else {
      const j=i-peakIdx;                       // 1..taper
      const factor=Math.max(0.45, 1-0.18*j);   // progressive taper, floor 45%
      vol=peakVol*factor; phase='taper';
    }
    // manual per-week cutback toggle (via week label click)
    if(b.weekScale && b.weekScale[i]!=null && b.weekScale[i]!==1){ vol*=b.weekScale[i]; if(phase==='build') phase='cutback'; }
    // distribute across days
    const days=[];
    let totW=0; const wArr=[];
    for(let d=0;d<7;d++){ const t=b.overrides[i+'-'+d]||b.pattern[d]; const w=(t==='rest')?0:(BLD_WEIGHT[t]||1); wArr.push({t,w}); totW+=w; }
    for(let d=0;d<7;d++){
      const {t,w}=wArr[d];
      if(t==='rest'||w===0){ days.push({type:'rest',dist:0,dur:0}); continue; }
      const dist=totW>0?vol*(w/totW):0;
      const dur=dist*(BLD_PACE[t]||6)*levelPaceMult(state.athletes.find(x=>x.id===b.athleteId).level);
      days.push({type:t,dist,dur});
    }
    weeks.push({vol,phase,days});
  }
  return weeks;
}

// append a new week that mirrors the current last week (day types + volume)
function duplicateLastWeek(){
  const b=builderState;
  if(b.weeks>=24){ toast('Max 24 weeks reached'); return; }
  const weeks=computeBlock();
  const last=b.weeks-1; const lastWeek=weeks[last]; const newIdx=b.weeks;
  // copy the effective day types into the new week as explicit overrides
  for(let d=0; d<7; d++){ b.overrides[newIdx+'-'+d]=lastWeek.days[d].type; }
  b.weeks+=1;
  // pin the new week's volume to match the week we duplicated
  b.weekScale=b.weekScale||{};
  const peakIdx=Math.max(0,b.weeks-1-b.taper);
  let rampVol;
  if(newIdx<=peakIdx){ rampVol=b.baseVolume*(1+(b.rampPct/100)*newIdx);
    if(b.cutbackEvery>0 && (newIdx+1)%b.cutbackEvery===0 && newIdx!==peakIdx) rampVol*=(1-b.cutbackPct/100);
  } else { const j=newIdx-peakIdx; rampVol=b.baseVolume*(1+(b.rampPct/100)*peakIdx)*Math.max(0.45,1-0.18*j); }
  b.weekScale[newIdx]= rampVol>0 ? lastWeek.vol/rampVol : 1;
  renderBuilderModal();
  toast('Duplicated week '+(last+1)+' → week '+(newIdx+1));
}

const CYCLE=['rest','easy','tempo','interval','fartlek','long','race'];
function cycleCell(i,d){
  const b=builderState; const cur=b.overrides[i+'-'+d]||b.pattern[d];

function toggleCutback(i){

  b.weekScale=b.weekScale||{}; b.weekScale[i]=b.manualCut[i]?(1-b.cutbackPct/100):1;
  renderBuilderPreview();

function resetBuilderOverrides(){ builderState.overrides={}; builderState.manualCut={}; builderState.weekScale={}; renderBuilderPreview(); toast('Tweaks reset'); }
function applyBlock(){
  const b=builderState; const a=state.athletes.find(x=>x.id===b.athleteId);
  const weeks=computeBlock();
  if(b.replace){
    // remove existing PLANNED runs on/after startMonday
    a.runs=a.runs.filter(r=>!(r.status==='planned' && r.date>=b.startMonday));
  }
  let count=0;
  weeks.forEach((w,i)=>{
    w.days.forEach((d,di)=>{
      if(d.type==='rest') return;
      const date=addDays(b.startMonday,i*7+di);
      const phaseNote=w.phase==='cutback'?'Cutback/recovery week — keep it honest and easy.':w.phase==='taper'?'Taper — stay sharp, trust the training.':'Build week — progressive overload.';
      let workout=null;
      if(TYPES[d.type].structured){
        const {wu,cd,sets}=buildWorkout(d.type,a.level,Math.max(1,w.vol/b.baseVolume));
        workout={warmup:wu,cooldown:cd,sets};
      }
      // strides / hill sprints after easy & long runs
      let strides=null, strideNote='';
      if(b.stridesMode && b.stridesMode!=='off' && (d.type==='easy'||d.type==='long')){
        const isH=b.stridesMode==='hills';
        strides={mode:isH?'hills':'strides', count:isH?8:6, length:isH?'10s':'100m'};
        strideNote=` · finish with ${strides.count}×${strides.length} ${isH?'hill sprints':'strides'}`;

function setProgTrendTab(tab){ progTrendTab=tab; renderProgression(currentAthlete()); }
