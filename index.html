// Monday (ISO, local) of the week containing this date — used to bucket weekly aggregates
function mondayOf(iso){ const d=parseISO(iso); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function vdotTrendData(a){
  return (a.benchmarkHistory||[]).slice().sort((x,y)=>x.date.localeCompare(y.date)).map(h=>{
    const d=RACE_DISTS.find(x=>x.k===h.distKey); if(!d) return null;
    const v=vdotFrom(d.m,h.timeSec); return v>0 ? {date:h.date, y:v, label:`${d.label} in ${secToClock(h.timeSec)}`} : null;
  }).filter(Boolean);
}
function easyPaceTrendData(a){
  const runs=doneRuns(a).filter(r=>r.type==='easy' && r.distance>0 && r.duration>0);
  const byWeek={};
  runs.forEach(r=>{ const wk=mondayOf(r.date); (byWeek[wk]=byWeek[wk]||[]).push(r); });
  return Object.keys(byWeek).sort().map(wk=>{
    const rs=byWeek[wk]; const totKm=rs.reduce((s,r)=>s+r.distance,0), totMin=rs.reduce((s,r)=>s+r.duration,0);
    const secPerKm=(totMin*60)/totKm;
    return {date:wk, y:secPerKm, label:`${rs.length} run${rs.length===1?'':'s'}, ${fmtDist(totKm)} ${unitLabel()}`};
  });
}
// generic small-multiple trend line chart. higherIsBetter flips the trend-badge color logic.
function drawTrendChart(id, points, opts){
  const el=$('#'+id); if(!el) return;
  if(!points.length){ el.innerHTML=emptyHTML(opts.emptyTitle||'No data yet', opts.emptyBody||''); return; }
  if(points.length===1){
    el.innerHTML=`<div style="padding:28px 6px"><div style="font-size:28px;font-weight:800">${opts.valueFmt(points[0].y)}</div><div class="help" style="margin-top:6px">${esc(points[0].label||'')} on ${fmtDate(points[0].date)}. Add more results over time to see a trend line.</div></div>`;
    return;
  }
  const W=el.clientWidth||900,H=220,pad=38;
  const ys=points.map(p=>p.y); let minV=Math.min(...ys), maxV=Math.max(...ys);
  if(minV===maxV){ minV-=1; maxV+=1; } const padV=(maxV-minV)*0.15; minV-=padV; maxV+=padV;
  const t0=parseISO(points[0].date).getTime(), t1=parseISO(points[points.length-1].date).getTime(), span=Math.max(t1-t0,1);
  const yPix=y=>H-pad-((y-minV)/(maxV-minV))*(H-pad*2);
  const pts=points.map(p=>[pad+((parseISO(p.date).getTime()-t0)/span)*(W-pad*2), yPix(p.y)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${pts[pts.length-1][0].toFixed(1)} ${H-pad} L ${pad} ${H-pad} Z`;
  let grid='';
  for(let g=0;g<=4;g++){ const y=pad+g*((H-pad*2)/4), v=maxV-g*((maxV-minV)/4);
    grid+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--line)" stroke-width="1" opacity=".5"/><text x="4" y="${y+3}" fill="var(--muted)" font-size="9.5">${opts.axisFmt?opts.axisFmt(v):v.toFixed(1)}</text>`; }
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"><title>${esc(opts.valueFmt(points[i].y))} — ${fmtDate(points[i].date)}${points[i].label?' · '+esc(points[i].label):''}</title></circle>`).join('');
  // trend badge: compare first-half avg vs second-half avg
  const half=Math.max(1,Math.floor(points.length/2));
  const firstAvg=points.slice(0,half).reduce((s,p)=>s+p.y,0)/half;
  const lastAvg=points.slice(-half).reduce((s,p)=>s+p.y,0)/half;
  const improving = opts.higherIsBetter ? lastAvg>firstAvg : lastAvg<firstAvg;
  const pctChange = Math.abs(((lastAvg-firstAvg)/firstAvg)*100);
  const badge = pctChange<1.5 ? `<span class="trend-badge">➡️ Holding steady</span>` : improving ? `<span class="trend-badge up">📈 Improving ~${pctChange.toFixed(0)}%</span>` : `<span class="trend-badge down">📉 Down ~${pctChange.toFixed(0)}%</span>`;
  el.innerHTML=`<div style="display:flex;align-items:baseline;gap:8px;margin:2px 0 6px">
      <div style="font-size:24px;font-weight:800">${opts.valueFmt(points[points.length-1].y)}</div>
      <div style="color:var(--muted);font-size:12px">latest · ${fmtDate(points[points.length-1].date)}</div>${badge}
    </div>
    <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="grad-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,107,53,.35)"/><stop offset="1" stop-color="rgba(255,107,53,0)"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#grad-${id})"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}
    <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="5" fill="var(--accent-2)"/></svg>`;
}
function drawVdotChart(a,id){
  const data=vdotTrendData(a);
  drawTrendChart(id, data, {
    higherIsBetter:true,
    valueFmt:v=>`VDOT ${v.toFixed(1)}`,
    axisFmt:v=>v.toFixed(0),
    emptyTitle:'No fitness results logged yet',
    emptyBody:`Save a race or time-trial result in the 🧮 Pace Calculator to start tracking ${esc(a.name.split(' ')[0])}'s fitness over time.`,
  });
}
function drawEasyPaceChart(a,id){
  const data=easyPaceTrendData(a);
  drawTrendChart(id, data, {
    higherIsBetter:false,
    valueFmt:v=>`${paceSecToStr(v)}/${unitLabel()}`,
    axisFmt:v=>paceSecToStr(v),
    emptyTitle:'No easy runs logged yet',
    emptyBody:'Log some Easy runs to see average easy-effort pace trend weekly — a great automatic fitness signal.',
  });
}
function distByType(a){ const m={}; Object.keys(TYPES).forEach(k=>m[k]=0); doneRuns(a).forEach(r=>m[r.type]+=r.distance); return m; }
function drawTypeBars(m,id){
  const el=$('#'+id); if(!el) return; const total=Object.values(m).reduce((s,v)=>s+v,0)||1;
  el.innerHTML=Object.keys(TYPES).filter(k=>!TYPES[k].isRest).map(k=>{ const v=m[k],pct=v/total*100;
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px">
      <span style="font-weight:700">${TYPES[k].icon} ${TYPES[k].label}</span><span style="color:var(--muted)">${fmtDist(v)} ${unitLabel()} · ${pct.toFixed(0)}%</span></div>
      <div style="height:9px;background:var(--panel-2);border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${TYPES[k].color};border-radius:6px"></div></div></div>`; }).join('');
}
function avgWeekly(a){ const done=doneRuns(a); if(!done.length) return 0; const keys=new Set(done.map(r=>weekKey(parseISO(r.date)))); return sumDist(done)/Math.max(keys.size,1); }
function coachInsight(a){
  const wk=last12Weeks(a).map(w=>w.dist);
  const recent=wk.slice(-4).reduce((s,v)=>s+v,0)/4, prior=wk.slice(-8,-4).reduce((s,v)=>s+v,0)/4;
  const trend=recent>prior*1.05?'building nicely 📈':recent<prior*0.9?'in a down/recovery block 📉':'holding steady ➡️';
  const dist=distByType(a), total=Object.values(dist).reduce((s,v)=>s+v,0)||1;
  const easyPct=((dist.easy+dist.long)/total*100).toFixed(0);
  return `<b>${esc(a.name.split(' ')[0])}</b> is <b>${trend}</b> — averaging <b>${fmtDist(recent)} ${unitLabel()}</b>/week over the last month vs <b>${fmtDist(prior)} ${unitLabel()}</b> the month before.<br><br>
    Easy/aerobic work is <b>${easyPct}%</b> of volume. The classic target is ~80% easy / 20% hard — ${easyPct>=75?'right in the sweet spot. ✅':'consider adding easy volume to protect against injury. ⚠️'}<br><br>
    Level: <b style="text-transform:capitalize">${a.level}</b> · Goal: <b>${esc(a.goalRace)||'—'}</b>`;
}

/* ---------- Calendar (shows planned + done) ---------- */
function renderCalendar(a){
  const y=state.calYear,m=state.calMonth;
  const first=new Date(y,m,1); const startDow=(first.getDay()+6)%7;
  const days=new Date(y,m+1,0).getDate();
  const monthName=first.toLocaleDateString('en-CA',{month:'long',year:'numeric'});
  const from=new Date(y,m,1),to=new Date(y,m+1,0,23,59,59);
  const monthDone=runsInRange(doneRuns(a),from,to);
  const dow=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const raceByDate={}; (a.races||[]).forEach(r=>{ if(r.date) raceByDate[r.date]=r; });
  let cells=''; for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty-cell"></div>`;
  const todayStr=todayISO();
  for(let d=1;d<=days;d++){
    const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayRuns=a.runs.filter(r=>r.date===iso);
    const isToday=iso===todayStr;
    const race=raceByDate[iso];
    let chips = race ? `<div class="cal-chip race" title="${esc(race.name)}"><span>🏁 ${esc(race.name)}</span></div>` : '';
    chips += dayRuns.slice(0,2).map(r=>{ const t=TYPES[r.type];
      if(r.status==='planned') return `<div class="cal-chip plan" style="color:${t.color}"><span>${t.icon} ${t.label.split(' ')[0]}</span><span>${fmtDist(r.distance)}</span></div>`;
      return `<div class="cal-chip" style="background:${t.color}"><span>${t.icon} ${t.label.split(' ')[0]}</span><span>${fmtDist(r.distance)}</span></div>`; }).join('');
    if(dayRuns.length>2) chips+=`<div style="font-size:10px;color:var(--muted);margin-top:3px">+${dayRuns.length-2} more</div>`;
    const rest = (dayRuns.length===0 && !race)?`<span class="rest">rest</span>`:'';
    const cellCls = isToday?'today':(race?'race-day':'');
    cells+=`<div class="cal-cell ${cellCls}" data-date="${iso}"><div class="dn">${d}</div>${chips}${rest}</div>`;
  }
  $('#view-calendar').innerHTML=`
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button><h2>${monthName}</h2><button class="cal-nav" id="calNext">›</button>
      <button class="cal-nav" id="calToday" style="width:auto;padding:0 14px;font-size:13px;font-weight:700">Today</button>
      <div style="margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <span><i class="dot" style="background:var(--accent)"></i> done</span>
        <span><i class="dot" style="border:1.5px dashed var(--muted);background:transparent"></i> planned</span>
        <span><i class="dot" style="background:var(--race)"></i> race day</span>
        <span>${fmtDist(sumDist(monthDone))} ${unitLabel()} · ${monthDone.length} runs</span></div>
    </div>
    <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
  $('#calPrev').onclick=()=>{ state.calMonth--; if(state.calMonth<0){state.calMonth=11;state.calYear--;} renderCalendar(a); };
  $('#calNext').onclick=()=>{ state.calMonth++; if(state.calMonth>11){state.calMonth=0;state.calYear++;} renderCalendar(a); };
  $('#calToday').onclick=()=>{ const n=new Date();state.calMonth=n.getMonth();state.calYear=n.getFullYear(); renderCalendar(a); };
  document.querySelectorAll('.cal-cell[data-date]').forEach(c=>{
    c.onclick=()=>{ const iso=c.dataset.date; const dayRuns=a.runs.filter(r=>r.date===iso);
      if(dayRuns.length===1) openRunDetail(dayRuns[0].id);
      else if(dayRuns.length>1) openDayList(iso,dayRuns);
      else if(!shareMode) openRunModal(iso); };
  });
}

    <div class="modal-body">${runs.map(r=>runItemHTML(r)).join('')}</div>

  else { document.execCommand('copy'); done(); }
}
// try to load a shared snapshot from the URL hash before touching localStorage
let linkMode=false;
function tryLoadShareLink(){
  const h=location.hash;
  if(!h || h.indexOf('#share=')!==0) return false;
  try{
    const json=decodeURIComponent(escape(atob(h.slice(7))));
    const snap=JSON.parse(json);

    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:18px">
      <div><div class="section-title">📋 Coming up</div>
        ${nextPlan.length?nextPlan.map(r=>runItemHTML(r)).join(''):`<div class="card">${emptyHTML('Nothing scheduled','Your coach hasn’t prescribed upcoming runs yet.')}</div>`}</div>

        ${recent.length?recent.map(r=>runItemHTML(r)).join(''):`<div class="card">${emptyHTML('No runs yet','Your log will appear here.')}</div>`}</div>

  const shareVdot=vdotTrendData(a);

}

function renderSetRows(){

    <input type="text" value="${esc(s.target||'')}" data-i="${i}" data-k="target" placeholder="90s / hard">
    <input type="text" value="${esc(s.rest||'')}" data-i="${i}" data-k="rest" placeholder="90s jog">
    <button class="x" onclick="removeSet(${i})">×</button></div>`).join('');
  el.querySelectorAll('input').forEach(inp=>{
    inp.oninput=()=>{ draftSets[+inp.dataset.i][inp.dataset.k]= inp.dataset.k==='reps'?+inp.value:inp.value; if(inp.dataset.k==='target') draftSets[+inp.dataset.i].autofill='0'; };
  });
}
function addSet(){ draftSets.push({reps:4,effort:'200m',target:'',rest:'60s'}); renderSetRows(); }
function removeSet(i){ draftSets.splice(i,1); if(!draftSets.length) draftSets.push({reps:1,effort:'',target:'',rest:''}); renderSetRows(); }

/* ---------- Actual interval/tempo/fartlek rep logging ---------- */
function setActualReps(n){
  n=Math.max(1,Math.min(40,parseInt(n)||1));
  const times=actualWorkout.times;
  if(n>times.length){ while(times.length<n) times.push(0); }
  else { times.length=n; }
  renderActualRows();
}
function setActualMeta(){
  actualWorkout.distance=parseFloat($('#aw-dist').value)||0;
  actualWorkout.unit=$('#aw-unit').value;
  const rm=parseInt($('#aw-rest-m').value)||0, rs=Math.max(0,Math.min(59,parseInt($('#aw-rest-s').value)||0));
  actualWorkout.restSec=rm*60+rs;
  renderActualRows();
}
function setActualRepTime(i,which,val){
  const cur=actualWorkout.times[i]||0;
  let m=Math.floor(cur/60), s=cur%60;
  if(which==='m') m=Math.max(0,parseInt(val)||0); else s=Math.max(0,Math.min(59,parseInt(val)||0));
  actualWorkout.times[i]=m*60+s;
  renderActualRowPace(i);
  recalcActualTotals();
}
function actualRowPaceStr(timeSec){
  const km=repDistToKm(actualWorkout.distance,actualWorkout.unit);
  if(!km||!timeSec) return '—';
  return paceSecToStr(timeSec/km)+'/'+unitLabel();
}
function renderActualRowPace(i){
  const el=document.querySelector(`.aw-row[data-i="${i}"] .awp`); if(!el) return;
  el.innerHTML=`${actualRowPaceStr(actualWorkout.times[i])}<small> pace</small>`;
}
function renderActualRows(){
  const el=$('#awRows'); if(!el) return;
  el.innerHTML=actualWorkout.times.map((t,i)=>{
    const m=Math.floor(t/60), s=t%60;
    return `<div class="aw-row" data-i="${i}">
      <div class="awn">#${i+1}</div>
      <div class="awt">
        <input type="number" min="0" value="${t?m:''}" placeholder="mm" oninput="setActualRepTime(${i},'m',this.value)">
        <span style="color:var(--muted);font-weight:800">:</span>
        <input type="number" min="0" max="59" value="${t?String(s).padStart(2,'0'):''}" placeholder="ss" oninput="setActualRepTime(${i},'s',this.value)">
      </div>
      <div class="awp">${actualRowPaceStr(t)}<small> pace</small></div>
    </div>`;
  }).join('');
  recalcActualTotals();
}
// auto-fill the Total distance / Total time fields from the logged reps (main set only)
function recalcActualTotals(){
  const wrap=$('#actualWorkoutWrap'); if(!wrap || wrap.style.display==='none') return;
  const km=repDistToKm(actualWorkout.distance,actualWorkout.unit);
  const reps=actualWorkout.times.length;
  const timedReps=actualWorkout.times.filter(t=>t>0).length;
  const totalKm=km*reps;
  const totalSec=actualWorkout.times.reduce((s,t)=>s+t,0) + actualWorkout.restSec*Math.max(0,timedReps-1);
  const sumEl=$('#awSummary');
  if(sumEl){
    const avgPace = timedReps ? actualWorkout.times.filter(t=>t>0).reduce((s,t)=>s+t,0)/(km*timedReps) : 0;
    sumEl.innerHTML = totalKm>0 ? `<div class="aw-summary">
      <div>Main set distance<b>${fmtDist(totalKm)} ${unitLabel()}</b></div>
      <div>Main set time<b>${secToClock(totalSec)}</b></div>
      <div>Avg rep pace<b>${avgPace?paceSecToStr(avgPace)+'/'+unitLabel():'—'}</b></div>
    </div>` : '';
  }
  // grand total (auto-fills Total distance/time above) includes warm-up + cool-down too —
  // but only whichever mode (time or distance) is actually selected for each
  const grandKm = totalKm + (draftWarmup.mode==='dist'?draftWarmup.dist||0:0) + (draftCooldown.mode==='dist'?draftCooldown.dist||0:0);
  const grandSec = totalSec + (draftWarmup.mode==='time'?(draftWarmup.dur||0)*60:0) + (draftCooldown.mode==='time'?(draftCooldown.dur||0)*60:0);
  if(grandKm>0 && $('#f-dist')){
    $('#f-dist').value=fmtDist(grandKm,2);
    const h=Math.floor(grandSec/3600), m=Math.floor((grandSec%3600)/60), s=Math.round(grandSec%60);
    if($('#f-dur-h')) $('#f-dur-h').value=h; if($('#f-dur-min')) $('#f-dur-min').value=m; if($('#f-dur-sec')) $('#f-dur-sec').value=s;
  }
}

function saveRun(editId){
  const a=currentAthlete();
  const type=document.querySelector('#typePicker .type-opt.sel').dataset.type;
  const isRest=!!TYPES[type].isRest;
  const date=isRest ? ($('#f-date-rest')?$('#f-date-rest').value:$('#f-date').value) : $('#f-date').value;
  if(!date){ toast('Pick a date'); return; }
  const planned=draftMode==='planned';
  // rest day: no metrics, no workout, no strides
  if(isRest){
    const run={ id:editId||uid(), date, type:'rest', distance:0, duration:0, workout:null, strides:null, status:planned?'planned':'done' };
    if(planned){ run.coachNote=$('#f-coachnote')?$('#f-coachnote').value.trim():'Full rest — recover and adapt.'; run.rpe=null; run.notes=''; }
    else { run.rpe=null; run.notes=$('#f-notes')?$('#f-notes').value.trim():''; }
    if(editId){ const idx=a.runs.findIndex(r=>r.id===editId); a.runs[idx]=run; } else a.runs.push(run);
    save(); closeModal(); render(); toast(editId?'Updated ✓':(planned?'Rest day scheduled ✓':'Rest day logged ✓'));
    return;
  }
  const hideMetrics = planned && TYPES[type].structured;
  let wuF={dist:0,dur:0}, cdF={dist:0,dur:0};
  if(TYPES[type].structured){
    wuF = draftWarmup.mode==='dist' ? {dist:draftWarmup.dist||0, dur:0} : {dist:0, dur:draftWarmup.dur||0};
    cdF = draftCooldown.mode==='dist' ? {dist:draftCooldown.dist||0, dur:0} : {dist:0, dur:draftCooldown.dur||0};
  }
  let dist, dur;
  if(hideMetrics){
    // no manual distance/time for a prescribed interval/tempo/fartlek session —
    // the warm-up + cool-down (which we do know precisely) stand in for it;
    // the main set itself is defined by the reps below, not estimated here.
    dist = wuF.dist + cdF.dist;
    dur = wuF.dur + cdF.dur;
  } else {
    dist=parseFloat($('#f-dist').value)||0; if(state.unit==='mi') dist*=KM_PER_MI;
    const durHInput=parseInt($('#f-dur-h').value)||0;
    const durMinInput=parseInt($('#f-dur-min').value)||0;
    const durSecInput=Math.max(0,Math.min(59,parseInt($('#f-dur-sec').value)||0));
    dur=durHInput*60+durMinInput+durSecInput/60;
  }
  let workout=null;
  if(TYPES[type].structured){
    if(planned){
      workout={ warmup:wuF, cooldown:cdF,
        sets:draftSets.filter(s=>s.effort).map(s=>({reps:+s.reps||1,effort:s.effort,target:s.target,rest:s.rest})),
        actual:null };
    } else {
      // logging actual reps via the "Log your actual reps" builder
      const aw=actualWorkout;
      const km=repDistToKm(aw.distance,aw.unit);
      const timedTimes=aw.times.filter(t=>t>0);
      const avgSec = (timedTimes.length && km) ? timedTimes.reduce((s,t)=>s+t,0)/(km*timedTimes.length) : 0;
      const distLabel = aw.distance ? `${aw.distance}${aw.unit}` : '—';
      const restLabel = aw.restSec ? `${Math.floor(aw.restSec/60)}:${String(aw.restSec%60).padStart(2,'0')}` : '';
      const summarySet = { reps:aw.times.length, effort:distLabel, target:avgSec?paceSecToStr(avgSec)+'/'+unitLabel()+' avg':'', rest:restLabel };
      workout={ warmup:wuF, cooldown:cdF, sets:[summarySet], actual:JSON.parse(JSON.stringify(aw)) };
    }
  }
  // strides / hill sprints add-on
  let strides=null;
  const sMode=$('#s-mode')?$('#s-mode').value:'off';
  if(sMode!=='off'){
    strides={ mode:sMode, count:parseInt($('#s-count').value)||6, length:($('#s-length').value||'').trim()||(sMode==='hills'?'10s':'100m') };
  }
  const run={ id:editId||uid(), date, type, distance:+dist.toFixed(2), duration:dur, workout, strides, status:planned?'planned':'done' };
  if(planned){ run.coachNote=$('#f-coachnote')?$('#f-coachnote').value.trim():''; run.rpe=null; run.notes=''; }
  else { const rpeEl=document.querySelector('#rpeRow .rp.sel'); run.rpe=rpeEl?+rpeEl.dataset.rpe:null; run.notes=$('#f-notes')?$('#f-notes').value.trim():''; }
  if(editId){ const idx=a.runs.findIndex(r=>r.id===editId); a.runs[idx]=run; }
  else a.runs.push(run);
  save(); closeModal(); render(); toast(editId?'Updated ✓':(planned?'Workout prescribed ✓':'Run logged ✓'));
}

/* ---------- Run detail ---------- */
function openRunDetail(id){
  const a=currentAthlete(); const r=a.runs.find(x=>x.id===id); if(!r) return;
  const t=TYPES[r.type]; const planned=r.status==='planned'; const isRest=!!t.isRest;
  let wk='';
  if(r.workout){
    const setHtml=r.workout.sets.map(s=>`<div class="wk-set"><span class="rep">${s.reps}×</span><span style="font-weight:700">${esc(s.effort)}</span>
      ${s.target?`<span style="color:var(--muted)">@ ${esc(s.target)}</span>`:''}${s.rest?`<span style="margin-left:auto;color:var(--muted)">rest ${esc(s.rest)}</span>`:''}</div>`).join('');
    let repBlk='';
    const aw=r.workout.actual;
    if(aw && aw.times && aw.times.some(t=>t>0)){
      const km=repDistToKm(aw.distance,aw.unit);
      const rows=aw.times.map((t,i)=> t>0 ? `<div class="wk-set"><span class="rep">#${i+1}</span><span style="font-weight:700">${secToClock(t)}</span><span style="margin-left:auto;color:var(--muted)">${km?paceSecToStr(t/km)+'/'+unitLabel():''}</span></div>` : '').join('');
      repBlk=`<div class="wk-block"><div class="h">⏱️ Rep-by-rep</div>${rows}</div>`;
    }
    wk=`<div class="wk-block"><div class="h">🔥 Warm-up</div>${fmtWarmCool(r.workout.warmup)}</div>
      <div class="wk-block"><div class="h">⚡ Main set</div>${setHtml||'—'}</div>
      ${repBlk}
      <div class="wk-block"><div class="h">💧 Cool-down</div>${fmtWarmCool(r.workout.cooldown)}</div>`;
  }
  const metrics = isRest
    ? `<div class="dm" style="grid-column:1/-1"><div class="n">😴 Rest Day</div><div class="l">no running — recover, sleep, adapt</div></div>`
    : planned
    ? `<div class="dm"><div class="n">${fmtDist(r.distance)}</div><div class="l">${unitLabel()} target</div></div>
       <div class="dm"><div class="n">${fmtDur(r.duration)}</div><div class="l">est time</div></div>
       <div class="dm"><div class="n">${paceStr(r.distance,r.duration)}</div><div class="l">/${unitLabel()} target</div></div>
       <div class="dm"><div class="n">📋</div><div class="l">planned</div></div>`
    : `<div class="dm"><div class="n">${fmtDist(r.distance)}</div><div class="l">${unitLabel()}</div></div>
       <div class="dm"><div class="n">${fmtDur(r.duration)}</div><div class="l">duration</div></div>
       <div class="dm"><div class="n">${paceStr(r.distance,r.duration)}</div><div class="l">/${unitLabel()} pace</div></div>
       <div class="dm"><div class="n">${r.rpe||'—'}</div><div class="l">RPE effort</div></div>`;
  const stridesBlk = r.strides?`<div class="wk-block"><div class="h">${r.strides.mode==='hills'?'⛰️ Hill sprints':'🏃💨 Strides'}</div><div style="line-height:1.6"><b>${r.strides.count} × ${r.strides.length}</b> ${r.strides.mode==='hills'?'hill sprints':'strides'} after the run — build speed &amp; strength.</div></div>`:'';
  const coachBlk = planned&&r.coachNote?`<div class="wk-block"><div class="h">🎯 Coach note</div><div style="line-height:1.6">${esc(r.coachNote)}</div></div>`:'';
  const diaryBlk = !planned&&r.notes?`<div class="wk-block"><div class="h">📝 Diary</div><div style="line-height:1.6">${esc(r.notes)}</div></div>`:'';
  let foot;
  if(shareMode){ foot=`<button class="btn btn-primary" onclick="closeModal()">Done</button>`; }
  else if(planned){ foot=`<button class="btn btn-ghost" style="color:var(--interval)" onclick="deleteRun('${r.id}');closeModal()">Delete</button>
      <button class="btn btn-ghost" onclick="openRunModal(null,'${r.id}')">Edit plan</button>
      <button class="btn btn-primary" onclick="completePlanned('${r.id}')">✅ Mark complete</button>`; }
  else { foot=`<button class="btn btn-ghost" style="color:var(--interval)" onclick="deleteRun('${r.id}');closeModal()">Delete</button>
      <button class="btn btn-ghost" onclick="openRunModal(null,'${r.id}')">Edit</button>
      <button class="btn btn-primary" onclick="closeModal()">Done</button>`; }
  openModal(`
    <div class="modal-head"><h2 style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">${t.icon}</span> ${t.label} ${planned?'<span class="tag tag-planned">Planned</span>':''}</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="color:var(--muted);font-weight:600;margin-bottom:4px">${parseISO(r.date).toLocaleDateString('en-CA',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
      <div class="detail-metrics">${metrics}</div>${coachBlk}${wk}${stridesBlk}${diaryBlk}
    </div>
    <div class="modal-foot">${foot}</div>`);
}
// convert a planned prescription into a completed run (prefill the log modal)
function completePlanned(id){
  const a=currentAthlete(); const r=a.runs.find(x=>x.id===id); if(!r) return;
  r.status='done'; r.date=todayISO(); r.notes=r.coachNote?('Prescribed: '+r.coachNote):'';
  r.rpe = TYPES[r.type].isRest ? null : (r.rpe||6);
  save(); closeModal(); render(); toast('Marked complete ✓ — moved to log');
}

/* ---------- Athlete modal ---------- */
function openAthleteModal(){ athleteForm(null); }
function editAthlete(id){ athleteForm(id); }
let draftRaces=[];
function athleteForm(id){
  const a = id ? state.athletes.find(x=>x.id===id) : null;
  draftRaces = a && a.races ? JSON.parse(JSON.stringify(a.races)) : [];
  openModal(`
    <div class="modal-head"><h2>${a?'Edit':'Add'} Athlete</h2><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Name</label><input id="a-name" value="${a?esc(a.name):''}" placeholder="e.g. Jordan Reyes"></div>
      <div class="field"><label>Experience level</label>
        <select id="a-level">
          <option value="beginner" ${a&&a.level==='beginner'?'selected':''}>Beginner — building the habit</option>
          <option value="intermediate" ${a&&a.level==='intermediate'?'selected':''}>Intermediate — racing regularly</option>
          <option value="elite" ${a&&a.level==='elite'?'selected':''}>Elite — high volume / competitive</option>
        </select><div class="help">Level tailors suggested weekly targets and coach-note benchmarks.</div></div>
      <div class="field"><label>Races</label>
        <div id="racesList"></div>
        <button type="button" class="add-set" onclick="addRaceRow()">＋ Add race</button>
        <div class="help">The soonest upcoming race drives the countdown card and shows as a 🏁 marker on the calendar.</div></div>
      <div class="field"><label>Weekly target (${unitLabel()})</label><input type="number" id="a-target" value="${a?fmtDist(a.weeklyTarget||0,0):defaultTarget('beginner')}" placeholder="20"></div>
      ${a?`<div class="help">🧮 Tip: use the <b>Paces</b> button on ${esc(a.name.split(' ')[0])}'s athlete card to set a fitness benchmark for accurate workout paces.</div>`:''}
    </div>
    <div class="modal-foot">
      ${a?`<button class="btn btn-ghost" style="color:var(--interval);margin-right:auto" onclick="removeAthlete('${a.id}')">Delete athlete</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAthlete('${id||''}')">${a?'Save':'Add athlete'}</button></div>`);
  $('#a-level').onchange=e=>{ if(!a) $('#a-target').value=defaultTarget(e.target.value); };
  renderRaceRows();
}
function renderRaceRows(){
  const el=$('#racesList'); if(!el) return;
  el.innerHTML = draftRaces.length ? draftRaces.map((r,i)=>`
    <div class="race-row">
      <input type="text" value="${esc(r.name)}" data-i="${i}" data-k="name" placeholder="e.g. Boston Marathon">
      <input type="date" value="${r.date||''}" data-i="${i}" data-k="date">
      <button class="x" onclick="removeRaceRow(${i})" title="Remove">×</button>
    </div>`).join('') : `<div class="help" style="margin:0 0 8px">No races yet — add one below.</div>`;
  el.querySelectorAll('input').forEach(inp=>{
    inp.oninput=()=>{ draftRaces[+inp.dataset.i][inp.dataset.k]=inp.value; };
  });
}
function addRaceRow(){ draftRaces.push({id:uid(),name:'',date:''}); renderRaceRows(); }
function removeRaceRow(i){ draftRaces.splice(i,1); renderRaceRows(); }
function defaultTarget(level){ const km=level==='beginner'?20:level==='intermediate'?55:100; return Math.round(toUnit(km)); }
function saveAthlete(id){
  const name=$('#a-name').value.trim(); if(!name){ toast('Enter a name'); return; }
  let target=parseFloat($('#a-target').value)||0; if(state.unit==='mi') target*=KM_PER_MI;
  const races=draftRaces.filter(r=>r.name.trim()&&r.date).map(r=>({id:r.id||uid(),name:r.name.trim(),date:r.date}));
  const data={name,level:$('#a-level').value,races,weeklyTarget:+target.toFixed(1)};
  let athlete;
  if(id){ athlete=state.athletes.find(x=>x.id===id); Object.assign(athlete,data); }
  else { athlete={id:uid(),runs:[],benchmark:null,benchmarkHistory:[],...data}; state.athletes.push(athlete); state.activeAthlete=athlete.id; }
  syncPrimaryRace(athlete);
  save(); closeModal(); render(); toast(id?'Athlete updated ✓':'Athlete added ✓');
}
function removeAthlete(id){
  if(!confirm('Delete this athlete and all their runs?')) return;
  state.athletes=state.athletes.filter(a=>a.id!==id);
  if(state.activeAthlete===id) state.activeAthlete=state.athletes[0]?.id||null;
  save(); closeModal(); render(); toast('Athlete removed');
}

/* ---------- Mobile sidebar drawer ---------- */
function openSidebar(){ document.querySelector('.sidebar').classList.add('open'); $('#sidebarBackdrop').classList.add('open'); }
function closeSidebar(){ document.querySelector('.sidebar').classList.remove('open'); $('#sidebarBackdrop').classList.remove('open'); }

/* ---------- Theme ---------- */
function applyTheme(){
  const light=state.theme==='light';
  document.body.classList.toggle('light',light);
  $('#themeIcon').textContent=light?'☀️':'🌙';
  $('#themeLabel').textContent=light?'Light mode':'Dark mode';
}
function toggleTheme(){ state.theme=state.theme==='light'?'dark':'light'; applyTheme(); save(); if(currentView==='dashboard'||currentView==='progression'||currentView==='share') render(); }

/* ============================================================
   BOOT
   ============================================================ */
function restoreBackup(){
  const backup=localStorage.getItem('elevate_v3_backup');
  if(!backup){ toast('No backup found yet — backups are created automatically after your first save.'); return; }
  if(!confirm('Restore the last automatic backup? This will replace whatever is currently loaded with the previous saved version. Your current in-app data will be overwritten.')) return;
  try{
    state=JSON.parse(backup); migrate(); save(); applyTheme(); setView('dashboard');
    toast('Backup restored ✓');
  }catch(e){ toast('Backup could not be read — it may be corrupted too.'); }
}
function boot(){
  const isLink=tryLoadShareLink();
  if(!isLink && !load()){ seed(); save(); }
  if(!state.theme) state.theme='dark';
  applyTheme();
  // cross-tab safety: if another tab saves newer data while this tab is open,
  // don't let this tab's next save silently clobber it — reload in place instead
  if(!isLink){
    window.addEventListener('storage', e=>{
      if(e.key==='elevate_v3' && e.newValue && e.newValue!==JSON.stringify(state)){
        if(document.querySelector('.modal-bg.open')){
          toast('Data changed in another tab — please finish here, then reload.');
        } else {
          try{ state=JSON.parse(e.newValue); migrate(); render(); toast('Synced from another tab ✓'); }catch(err){ /* ignore malformed event */ }
        }
      }
    });
  }
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{ if(shareMode) exitShare(); setView(b.dataset.view); closeSidebar(); });
  $('#hamburgerBtn').onclick=openSidebar;
  $('#sidebarBackdrop').onclick=closeSidebar;
  $('#exportBtn').onclick=exportData;
  $('#paceBtn').onclick=()=>openPaceCalc();
  $('#importBtn').onclick=()=>$('#importFile').click();
  $('#importFile').onchange=e=>{ importData(e.target.files[0]); e.target.value=''; };
  $('#restoreBackupLink').onclick=e=>{ e.preventDefault(); restoreBackup(); };
  document.querySelectorAll('#unitToggle button').forEach(b=>b.onclick=()=>{
    state.unit=b.dataset.unit; document.querySelectorAll('#unitToggle button').forEach(x=>x.classList.toggle('active',x===b)); save(); render(); });
  document.querySelectorAll('#unitToggle button').forEach(b=>b.classList.toggle('active',b.dataset.unit===state.unit));
  $('#themeBtn').onclick=toggleTheme;
  $('#athleteSelect').onchange=e=>{ state.activeAthlete=e.target.value; save(); render(); };
  $('#addRunBtn').onclick=()=>openRunModal(todayISO());
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); closeSidebar(); } });
  window.addEventListener('resize',()=>{ if(window.innerWidth>760) closeSidebar(); if(['dashboard','progression','share'].includes(currentView)) render(); });
  setView(isLink?'share':'dashboard');
}
document.addEventListener('DOMContentLoaded',boot);

</script>
